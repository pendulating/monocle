# ─── Robustness battery arm: persona ─────────────────────────────────────────
# Case:     Subway safety. Base file: pairwise_subway_safety_ordinal.yaml
# Change:   the July expert persona is ADDED as the system turn
# Everything else is the canonical minimal contract. The structured_output
# block is a byte copy of the base file, so guided decoding does not change.
# Plan:     research/docs/robustness-battery-rerun-plan.md (phase 2)

system: |
  You are an expert urban planner and sociologist. You will be shown two
  street-level photographs depicting the exteriors of two different New York
  City subway station entrances and asked which one appears to be safer for
  commuters and residents.

user_template: |
  Image A is the first image and Image B is the second image.
  Both show New York City subway station entrances.
  Which station entrance looks safer?

  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore

  Interpret this as "the station entrance in Image A is <label> safe than the
  one in Image B". Use "Same" when they look about the same.

structured_output:
  enabled: true
  # Abstention label, ON for every case in the consolidated battery: the stage
  # appends `not_sure_label` to the answer enum below AND adds a guidance line
  # to the prompt. Abstentions score as NaN (excluded from the ordinal scale),
  # NOT as "Same". Turn off only for an explicit ablation:
  #   prompt.structured_output.allow_not_sure=false
  allow_not_sure: true
  not_sure_label: NotSure
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    # false → guided decoding forbids extra keys. With `true`, the model emits
    # a free-form "reasoning" field (~180 tokens of inline chain-of-thought)
    # even when thinking is off, which negates the throughput of a non-thinking
    # run. Strict output = just {answer (+confidence)} ≈ 10-15 tokens.
    additionalProperties: false
