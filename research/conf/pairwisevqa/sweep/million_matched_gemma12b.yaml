# @package _global_
# MATCHED CONTROL AT 100,000 PAIRS — gemma-4-12b only, 7 cases.
#
# ─── Why this sweep exists ───────────────────────────────────────────────────
# The `nocity` and `textfirst` arms read against `million_proxy_gemma12b`, and
# that control differs from them in 2 ways that are NOT the named change:
#
# | Quantity          | `million_proxy_gemma12b` | `nocity` / `textfirst`      |
# |-------------------|--------------------------|-----------------------------|
# | Layout            | `interleaved_labels`     | `images_then_labels` /      |
# |                   |                          | `text_first_labels`         |
# | Pairs             | 1,000,000                | 100,000                     |
# | `pair_id` shared  | 91.7% of the arm's rows  | 100% between the 2 arms     |
#
# Measured 2026-09-01: the 2 arms share 100% of their `pair_id` rows with each
# other, and 91.7% with the 1,000,000-pair control. Thus a gemma delta held the
# named change AND the layout, on 92% of the pairs.
#
# This sweep runs the CANONICAL prompt, with abstention ON, on
# `images_then_labels`, over the SAME 100,000-pair table. It changes nothing
# else. It is the control that joins both arms pair for pair.
#
# ─── What changes against `million_nocity_gemma12b` ──────────────────────────
# ONE thing: the pipelines are the `*_matched` variants, which inherit their
# base case and override NOTHING. Thus the prompt names the city again.
#
# ┌─ THIS IS THE `matched` ARM, NOT THE `canonical` ARM ───────────────────────┐
# │ The registry files a run by what it did. A run of the canonical prompt on  │
# │ the required layout would read as `canonical` and collide with the         │
# │ 1,000,000-pair cell, and the 1,000,000-row floor would then refuse it.     │
# │ The `_matched` suffix names the arm, the same way `_nocity` does.          │
# │                                                                            │
# │ Read `nocity` / gemma and `textfirst` / gemma against THIS arm. The qwen    │
# │ halves keep the 1,000,000-pair control: that rater ran 1 layout in both.   │
# └────────────────────────────────────────────────────────────────────────────┘
#
# ─── Sizing ──────────────────────────────────────────────────────────────────
# | Quantity            | Value                                               |
# |---------------------|-----------------------------------------------------|
# | Rows for each case  | 110,000 (100,000 pairs + a 10% repeat fraction)     |
# | Shards for each case| 5, thus about 22,000 rows for each shard            |
# | Jobs                | 35 (7 cases x 5 shards)                             |
# | Chunk               | 2,048 rows — what a preemption loses                |
#
# The shard count matches `million_nocity_gemma12b`, thus each shard reads the
# same slice of the same prebuilt table.
#
# ─── Launch ──────────────────────────────────────────────────────────────────
#   bash research/scripts/launch_matched_battery.sh --dry-run
#   bash research/scripts/launch_matched_battery.sh

sampling_params_vqa:
  max_tokens: 128

runtime:
  resume: true
  resume_chunk_rows: 2048

prompt:
  # The canonical orientation of this arch since 2026-08-20, and the layout
  # the `nocity` arm ran. See `feedback_images_then_labels_always`.
  image_layout: images_then_labels

pair_sampler:
  # The same draw as `million_nocity_gemma12b` and `million_textfirst_gemma12b`.
  max_pairs: 100000
  shard_count: 5

pipeline:
  graph:
    nodes:
      pairwise:
        launcher: slurm_gpu_preempt

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 32
  sweeper:
    params:
      model: gemma-4-12b/instruct
      pipeline: pairwise_subway_safety_mvp_matched,pairwise_libraries_mvp_matched,pairwise_schools_mvp_matched,pairwise_road_quality_mvp_matched,pairwise_parks_plazas_mvp_matched,pairwise_restaurants_mvp_matched,pairwise_street_photography_mvp_matched
      # 5 shards for each case. This MUST match `pair_sampler.shard_count`.
      pair_sampler.shard_index: range(0,5)
