# @package _global_
# THINKING MODE at scale — gemma-4-12b, all 7 cases, 100,000 pairs for each.
#
# The 10x scale-up of `looks_thinking_gemma12b.yaml` (10,000 pairs). Read
# that file for the thinking-mode contract: the `gemma4` reasoning parser,
# the sampling that must not be greedy, and the layout that binds 2 images.
# This file repeats only what differs.
#
# ─── Pairs: the cut of the 1,000,000-pair table, not a fresh draw ────────────
# The rows come from `multirun/pair_tables_100k_of_1m`, which
# `scripts/subset_pair_tables.py` cut out of the canonical 1,000,000-pair
# table row for row. Two things follow:
#
# 1. Every image is in the image pack. A fresh draw takes other photographs
#    of the same units, the pack does not hold them, and the shards then read
#    /share/ju over NFS, which collapses above about 30 shards. See
#    `docs/streaming-and-resume.md`.
# 2. Every row joins the greedy canonical battery on `pair_id` at 100%, thus a
#    trace sits beside the greedy label of the same pair, in the same A/B
#    order, on the same photographs.
#
# The runner accepts the cut only when `max_pairs` equals the canonical pairs
# the cut kept (100,000) and every other sampler setting equals the parent's.
# Do not change the sampler here.
#
# ─── Launch: submit_shards, never the monitor path ──────────────────────────
#   python -m dagspaces.pairwisevqa.submit_shards --sweep thinking100k_gemma12b \
#       --base-dir multirun/thinking100k_gemma12b_<stamp> \
#       --pairs-dir multirun/pair_tables_100k_of_1m --timeout-min 480 \
#       --parallel 128 \
#       --set runtime.image_pack=/share/ju/matt/mllmsci/multirun/pair_tables_1m/image_pack
#
# `research/scripts/launch_thinking100k.sh` holds that command for both raters.
#
# ─── Cost ────────────────────────────────────────────────────────────────────
# A thinking row costs 2.4 to 3.3 s on an A6000 (11,000 rows took 7.2 to 10 h
# on 2026-08-13). A case holds about 110,000 rows, thus about 73 to 100
# GPU-hours, and the 7 cases about 640 GPU-hours. 32 shards of about 3,440
# rows take 2.3 to 3.2 h each, inside the 480-minute walltime with the
# 13-minute NFS import. A preemption costs 1 chunk of 512 rows, and a shard
# that hits the walltime keeps its chunks: run `--only-missing` on the same
# base dir.
#
# Warning: these runs are NOT canonical for the proxy table. The model string
# is `gemma-4-12b/instruct_thinking` and the sampling is not greedy. They are
# trace runs. A `register` call over this root would make them the trace runs
# of the registry (110,000 rows beat 11,000 in the newest-wins rule), and the
# extraction corpora of 2026-08-28 and 2026-09-05 read the 11,000-row runs.
# Register on purpose, not by accident.

sampling_params_vqa:
  # Google's standard sampling for gemma-4-12b. Thinking mode must not be
  # greedy: greedy decoding repeats itself over a long trace.
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  # 1.45x headroom over the longest trace of the 10,000-pair corpus (2,827
  # tokens). The prompt is about 624 tokens, thus the ceiling is 4,720, inside
  # the 5,120 window of `instruct_thinking.yaml`.
  max_tokens: 4096

prompt:
  # The canonical gemma layout since 2026-09-02, and the layout of the
  # registered gemma trace runs. Text must sit BETWEEN the 2 images on this
  # arch, or the model reads them as 1 image.
  image_layout: interleaved_labels
  structured_output:
    allow_not_sure: true

pair_sampler:
  # Equals the canonical pairs of the cut. See the header.
  max_pairs: 100000
  shard_count: 32

runtime:
  # The `gpu` partition takes a node back, thus a shard must resume. 512 rows
  # is about 25 minutes of work, the unit of loss.
  resume: true
  resume_chunk_rows: 512

pipeline:
  graph:
    nodes:
      pairwise:
        launcher: slurm_gpu_preempt

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 128
  sweeper:
    params:
      model: gemma-4-12b/instruct_thinking
      # The shard AXIS. `submit_shards` reads the number of shards from THIS
      # line; `pair_sampler.shard_count` alone runs shard 0 only.
      pair_sampler.shard_index: range(0,32)
      pipeline: pairwise_subway_safety_mvp,pairwise_libraries_mvp,pairwise_schools_mvp,pairwise_road_quality_mvp,pairwise_parks_plazas_mvp,pairwise_restaurants_mvp,pairwise_street_photography_mvp
