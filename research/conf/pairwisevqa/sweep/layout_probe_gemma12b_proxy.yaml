# @package _global_
# LAYOUT PROBE, 1 of 2 — the greedy proxy path, gemma-4-12b.
#
# Question: does `images_then_labels` bind both images as well as
# `interleaved_labels` does?
#
# `images_then_labels` is new on 2026-08-20. It puts each text anchor AFTER
# its image:
#   image A, "Image A.", image B, "Image B.", prompt
# Google asks for image content before the text (gemma-4 model card, "Modality
# order"). The production layout `interleaved_labels` breaks that rule, because
# a text anchor opens the message. This layout obeys the rule and keeps the
# anchor.
#
# ┌─ WHY THE ANCHOR EXISTS ────────────────────────────────────────────────────┐
# │ Measured on 16 pairs with traces, 2026-08-13:                              │
# │                                                                            │
# │   layout              "only one image" in the trace   NotSure              │
# │   images_then_text    15 of 18                        83%                  │
# │   interleaved_labels   0 of 18                         5.6%                │
# │                                                                            │
# │ Two adjacent images with no text between them collapse into one image for  │
# │ this arch. Do not drop the anchor.                                         │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Warning: this arm CANNOT prove the layout works. A label-only run shows a
# binding failure as an honest abstention rate, and the two look the same. Read
# the thinking probe (`layout_probe_gemma12b_thinking.yaml`) for the proof, and
# read this file for the production-config label rates.
#
# LAUNCHER: klara_1x, NEVER klara_2x. gemma-4-12b is the encoder-free
# `gemma4_unified` arch, and the DP-worker path is not gated for its
# `<|image|>` template.
#
# SAMPLING: greedy, from conf/config.yaml, and max_tokens=128 — the same
# settings the proxy battery runs.
#
# PAIRS: 64, a deterministic seed-777 prefix. Both arms get the SAME 64 pairs,
# thus you can compare the labels pair by pair.
#
# ─── Launch ──────────────────────────────────────────────────────────────────
#   export HYDRA_SWEEP_DIR=multirun/layout_probe_gemma12b_proxy
#   .venv-mllmsci-vllm025cu129/bin/python -m dagspaces.pairwisevqa.cli \
#       --multirun +sweep=layout_probe_gemma12b_proxy \
#       prompt.image_layout=images_then_labels,interleaved_labels
#
# ─── How to read it ──────────────────────────────────────────────────────────
# | Signal                  | A good result                          |
# |-------------------------|----------------------------------------|
# | NotSure rate            | close to the interleaved_labels arm    |
# | Same rate               | close to the interleaved_labels arm    |
# | Much* rate              | not near zero                          |
# | Label agreement         | high, pair by pair, between the arms   |
#
# Warning: these runs are NOT canonical. The sweep name is not in
# CANONICAL_SWEEPS, so `research/notebooks/cvpr/_provenance.py` drops them.

sampling_params_vqa:
  max_tokens: 128

prompt:
  # The default arm. The launch command sweeps this key over both layouts.
  image_layout: interleaved_labels

pair_sampler:
  max_pairs: 64

pipeline:
  graph:
    nodes:
      pairwise:
        launcher: slurm_gpu_klara_1x   # NOT klara_2x

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 2
  sweeper:
    params:
      model: gemma-4-12b/instruct
      pipeline: pairwise_schools_mvp
