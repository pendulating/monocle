# @package _global_
# NO-CITY AT 100,000 PAIRS — rater 2 of 2, gemma-4-12b, 7 cases.
#
# Read `million_nocity_qwen9b.yaml` first. It holds the reasoning. This file
# changes only the rater and what that rater needs.
#
# ─── What changes against `looks_proxy_gemma12b` ─────────────────────────────
# ONE thing: every case reads its `*_nocity` prompt, which is its canonical
# prompt with "New York City" removed. Abstention stays ON. The pairs are the
# same 100,000 pairs, seed 777, thus the 2 batteries join by
# `canonical_pair_id`.
#
# The control is `million_proxy_gemma12b`. We measured on 2026-08-26 that the
# 100,000-pair draw at seed 777 is a SUBSET of the 1,000,000-pair draw, on all
# 7 cases. Join on `pair_id`, which carries the presentation order. See the
# correction box in `million_nocity_qwen9b.yaml`.
#
# ┌─ THE LAYOUT IS `images_then_labels` — THE CANONICAL ORIENTATION ───────────┐
# │ `images_then_labels` is the default and the canonical orientation of this  │
# │ arch since 2026-08-20. Every new gemma-4 sweep uses it. It opens with an   │
# │ image, which is what the gemma-4 card asks for under "Modality order", and │
# │ it binds the second image (0 of 70 one-image traces on the probe).         │
# │                                                                            │
# │ WHAT THIS COSTS WHEN YOU COMPARE. The control `million_proxy_gemma12b`    │
# │ ran on `interleaved_labels`, which was production until 2026-08-20. Thus   │
# │ the gemma half of this battery differs from its control in 2 ways: the     │
# │ place name AND the layout. The 2026-08-20 probe measured a real layout     │
# │ effect on the ABSTENTION rate (10 pairs into NotSure, 1 out, McNemar       │
# │ p=0.012, n=70, schools), and the abstention rate is what the removal of a  │
# │ place name is most likely to move.                                         │
# │                                                                            │
# │ Thus:                                                                      │
# │   * the qwen half reads cleanly — 1 layout, control holds;                 │
# │   * the gemma half CONFOUNDS the place name with the layout. Report its    │
# │     delta as such, or re-run the gemma control on `images_then_labels`.    │
# └────────────────────────────────────────────────────────────────────────────┘
#
# ─── Sizing ──────────────────────────────────────────────────────────────────
# | Quantity            | Value                                               |
# |---------------------|-----------------------------------------------------|
# | Rows for each case  | 110,000 (100,000 pairs + a 10% repeat fraction)     |
# | Shards for each case| 5, thus about 22,000 rows for each shard            |
# | Jobs                | 35 (7 cases x 5 shards)                             |
# | Chunk               | 2,048 rows — what a preemption loses                |
#
# 22,000 rows is about 100 minutes at the measured gemma rate. The launch
# script still asks for more than that, because a walltime expiry is terminal
# and a resumed shard pays the cold import again.

sampling_params_vqa:
  max_tokens: 128

runtime:
  resume: true
  resume_chunk_rows: 2048

prompt:
  # The canonical orientation of this arch since 2026-08-20. See the box above
  # for what it costs when you compare against the registered battery.
  image_layout: images_then_labels

pair_sampler:
  # The same draw as `looks_proxy_gemma12b`, thus the 2 batteries pair up.
  max_pairs: 100000
  shard_count: 5

pipeline:
  graph:
    nodes:
      pairwise:
        launcher: slurm_gpu_preempt

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 32
  sweeper:
    params:
      model: gemma-4-12b/instruct
      pipeline: pairwise_subway_safety_mvp_nocity,pairwise_libraries_mvp_nocity,pairwise_schools_mvp_nocity,pairwise_road_quality_mvp_nocity,pairwise_parks_plazas_mvp_nocity,pairwise_restaurants_mvp_nocity,pairwise_street_photography_mvp_nocity
      # 5 shards for each case. This MUST match `pair_sampler.shard_count`.
      pair_sampler.shard_index: range(0,5)
