- text: |
    Keep it practical and not too long. Use a little structure (short bold labels) but not an overwhelming list. No need for headers everywhere. Maybe a tight bullet list of 3 angles plus a couple of pro tips. Tone: like a friend who's good at photos.
  extractions:
  - extraction_class: none
    extraction_text: Keep it practical and not
- text: |
    ### 3. The "Low-Angle Street" Shot (Best for a cinematic/dynamic look)
    The current eye-level shot is a bit flat. Changing your height can make the scene feel more interesting.
    *   **How to do it:** Crouch down low, near the fence or the blue car. Aim your camera slightly upward toward the building.
    *   **Why it works:** A low angle makes the architecture look more imposing and grand. It also allows the lines of the sidewalk and the parked cars to act as "leading lines," drawing the viewer's eye deeper into the photo toward the building.
  extractions:
  - extraction_class: descriptor
