# @package extract
# Urban cue schema for 1 image, version 2 (2026-10-26), the x2 round (D130).
# Claude wrote it on the user's request: "Fix all extraction prompts in
# accordance with the advisor, and then re-run all extraction jobs
# overnight." The advisor review of 2026-10-26 found these faults in
# `single-v1` (scratchpad `fable-extractor-review.md`):
#
# 1. 161 texts got a copy of a whole example and no own span. Most were
#    caption answers, a shape that no example showed. The grammar forbids an
#    empty list, thus a text with nothing to say had no legal answer.
# 2. 52 long qwen3.5-9b traces made the extractor loop to the token cap, and
#    the second half of those traces got no span.
# 3. `inference.kind` was `other` for 49% of the spans; `wealth`, `class`,
#    `safety`, and `crime` almost never fired. `looks_equal` is a value for 2
#    images.
# 4. Long examples and many rules: the model copies the base rates of the
#    examples, and a rule with no example does not change the output.
#
# Against `single-v1`:
#
# a. The class `none` (no attributes) gives a legal, grounded answer to a
#    text or a chunk with nothing to extract: its span is the first words.
#    Example 2 shows it. It is never the last example.
# b. 7 short examples, 1 for each input shape: a restaurant trace start, a
#    plan-only chunk (`none`), a middle chunk of a trace, a caption trace, a
#    restaurant answer, a caption answer (a list of captions), and a short
#    Llama answer. Build them with `research/scripts/f4/build_single_v2_examples.py`.
# c. Chunks of 6,000 characters with 600 characters of context
#    (`context_window_chars`). A loop now loses at most 1 chunk, and
#    `max_tokens` is 6,144 for each chunk.
# d. `inference.kind` names what the `other` spans held (atmosphere,
#    business_type, neighborhood_character, popularity, quality, upkeep).
#    `uncertainty.reason` drops `looks_equal` and adds `illegible`,
#    `identity`, and `knowledge`.
# e. An inference span is 1 claim. Example 3 cuts a deliberation into
#    claims.
# f. A span can lie inside another span (example 1, example 4). The aligner
#    handles nested spans.
# g. Each text has a context line (the field, the model, the prompt),
#    through LangExtract's `additional_context`.
# h. `rescue_substrings`: when the aligner misplaces a span that is in the
#    text word for word, the backend finds it again (advisor finding 2).
#
# The input is `data/f4_traces/extract_input/f4_<case>_x2.parquet`
# (`research/scripts/f4/build_x2_input.py`): U+2011 is "-", and the offsets match the
# other x2 runs.
#
# Warning: raise `schema_version` when you change a class, an attribute, a
# value list, or an example. Never edit a version in place.
#
# Warning: keep `attribute_values` inside `VOCABULARY` in
# `research/notebooks/cvpr/_extractions.py`.

name: urban_cues_single
schema_version: single-v2

# Chunks of 6,000 characters. The library cuts at sentence ends and puts the
# last 600 characters of the chunk before into the prompt as context.
max_char_buffer: 6000
context_window_chars: 600

# About 5,000 tokens of instructions and examples, about 1,600 tokens of
# chunk and context, and the answer.
max_model_len: 32768

batch_length: 512
extraction_passes: 1
temperature: 0.0

# The cap for 1 chunk. A loop stops here and loses only its chunk.
max_tokens: 6144

# vLLM's penalty also counts the prompt tokens, thus it works against a
# verbatim copy of the text. The chunks cap the loops.
repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true

attribute_values:
  visual_evidence:
    valence: [good, bad, neutral]
    category: [people, cleanliness, upkeep, greenery, light, signage, traffic,
               construction, commerce, architecture, color, activity, other]
  inference:
    kind: [wealth, class, safety, crime, demographic, upkeep, quality, atmosphere,
           business_type, neighborhood_character, popularity, location, time,
           brand_knowledge, institution_knowledge, other]
  person_reference:
    used_in_judgment: ['yes', 'no']
  image_artifact:
    kind: [blur, angle, occlusion, time_of_day, weather, other]
  uncertainty:
    reason: [illegible, out_of_view, identity, knowledge, other]

prompt_description: |
  You read text that a vision-language model wrote about one street-level
  photograph in New York City. The user asked the model about a restaurant
  in the photograph, or asked for an Instagram caption. The text is the
  private reasoning of the model or its final answer, and it can be one part
  of a longer text. Extract what the model says. Do not judge the image
  yourself, and do not add anything the text does not say.

  Classes:

  - visual_evidence: a concrete thing that the model says it sees.
    valence: good, bad, neutral. category: people, cleanliness, upkeep,
    greenery, light, signage, traffic, construction, commerce, architecture,
    color, activity, other.
  - inference: a claim that the photograph cannot show, which the model draws
    from what it sees or from what it knows. kind: wealth (price, high-end,
    cheap), class, safety, crime, demographic (who lives, works, or eats
    there), upkeep, quality (of the food or the service), atmosphere (the
    feel of the place), business_type (the cuisine or the kind of business),
    neighborhood_character (the kind of area), popularity, location (the
    street, the neighborhood, the city), time (hours, era, season),
    brand_knowledge (facts about this business or its chain),
    institution_knowledge (facts about a building or an institution), other.
  - person_reference: a statement about the people in the photograph.
    used_in_judgment: yes when the model uses them to judge the place.
  - image_artifact: a statement about the photograph itself, not the place.
    kind: blur, angle, occlusion, time_of_day, weather, other.
  - uncertainty: words that hedge or say the model cannot tell. reason:
    illegible (cannot read a text), out_of_view, identity (not sure what or
    which place it is), knowledge (not sure of a fact past the image), other.
  - none: the text holds nothing above. Extract its first 3 to 6 words as
    `none`, and nothing else.

  Rules:

  1. Copy each span from the text, character for character, in the order of
     the text. Never paraphrase, and never join two parts of the text.
  2. Do not extract the same span two times. A span can lie inside a longer
     span when it has a different class.
  3. Extract nothing from the request that a trace repeats, from headings,
     or from the plan of the answer.
  4. An inference span is 1 claim, about 25 words at most. A long
     deliberation gives 1 span for each claim.
  5. In a caption, extract what the caption says about this place: a name on
     a sign, a thing in view, the kind of business or area, the feel, the
     light. Skip hashtags and lines that say nothing about this place.

examples:
- text: |
    Here's a thinking process that leads to the answer:

    1.  **Analyze the Request:** The user has provided an image of a restaurant and asked for more information about it.

    2.  **Image Analysis (Visual Evidence):**
        *   **Signage:** The prominent sign says "Morris Park Inn".
        *   **Address/Number:** There's a number "1024" visible on the sign.
        *   **Adjacent Business:** A blue sign to the left says "Alis...".
        *   **Street Signs:** To the right, street signs are partially visible: "Morris Park" and "Padding...".
        *   **Appearance:** It looks like a casual neighborhood spot/pub/inn. Red awning, outdoor seating (tables and chairs).
        *   **Setting:** Urban area, brick building, overhead power lines, parked cars.

    3.  **Search Strategy (Mental or Actual Search):**
        *   *Keywords:* "Morris Park Inn", "Morris Park Inn 1024", "Morris Park Inn New York" (since "Morris Park" is a known neighborhood in the Bronx, NYC).
  extractions:
  - extraction_class: visual_evidence
    extraction_text: The prominent sign says "Morris Park Inn"
    attributes:
      valence: neutral
      category: signage
  - extraction_class: visual_evidence
    extraction_text: There's a number "1024" visible on the sign
    attributes:
      valence: neutral
      category: signage
  - extraction_class: visual_evidence
    extraction_text: A blue sign to the left says "Alis..."
    attributes:
      valence: neutral
      category: signage
  - extraction_class: visual_evidence
    extraction_text: 'street signs are partially visible: "Morris Park" and "Padding..."'
    attributes:
      valence: neutral
      category: signage
  - extraction_class: image_artifact
    extraction_text: partially visible
    attributes:
      kind: occlusion
  - extraction_class: inference
    extraction_text: It looks like a casual neighborhood spot/pub/inn
    attributes:
      kind: atmosphere
  - extraction_class: visual_evidence
    extraction_text: Red awning, outdoor seating (tables and chairs)
    attributes:
      valence: neutral
      category: commerce
  - extraction_class: inference
    extraction_text: Urban area
