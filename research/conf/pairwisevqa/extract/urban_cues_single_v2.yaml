    extraction_text: 6.  **Refine the Language
- text: |2
        *   Wait, let's look at the "LUNAR" part again. The sign says "LUNAR PANDA". The "LUNAR" is small and above/to the left.
        *   So the restaurant is **Lunar Panda Chinese Restaurant**.

    3.  **Synthesize the description:**
        *   **Name:** Lunar Panda Chinese Restaurant. (Though the "Lunar" part is a bit faint, it's a known chain). Actually, looking really closely at the sign in the original image, to the left of "PANDA", there is text that is hard to read. It might just be "PANDA". However, "Lunar Panda" is a real chain. Let's assume it's "Lunar Panda" based on typical signage for that franchise, but stick to what is clearly visible: "PANDA CHINESE RESTAURANT".
        *   **Type:** Chinese Restaurant.
        *   **Visuals:** Yellow facade. Large black letters "PANDA".
        *   **Location clues:** Next to an "Olivia Market" (red sign). Olivia Markets are famously found in the Rockaway Peninsula and parts of Queens in NYC. The address "73-85" strongly points to a specific block in Queens (likely Howard Beach or Rockaway Park area given the "73" block number range usually corresponds to specific streets).
        *   **Condition:** The sign looks well-maintained but older style.
  extractions:
