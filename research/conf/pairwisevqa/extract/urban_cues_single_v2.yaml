    Vibe: urban, sunny, corner of a neighborhood—looks like NYC (the "SUNNYSIDE" name, the bodega, the painted brick signage, the bike lane all scream NYC, possibly Long Island City / Queens / Brooklyn). The light is warm, low-angle—late afternoon, long shadows.
