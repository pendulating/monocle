# @package extract
# Urban cue schema for 1 image, the subjective prompt (F9, D139 and D140),
# version 1 (2026-10-30). Accepted by D142; the F9 x2 round uses it.
#
# The F9 prompt asks for a judgment: "Does this look like a nice restaurant
# to eat at?". The F4 prompt asked for a description. This schema is
# `single-v2` plus 1 class, `verdict`, that holds the answer of the model.
# Every other class, attribute and value list is the text of `single-v2`,
# thus the `visual_evidence` valence of the F9 answers stays comparable with
# the F4 answers on the same images (runbook F9, step 6; F8.1 method B).
#
# Against `single-v2`:
#
# a. The class `verdict` with the attribute `label` (yes, no, mixed,
#    graded, not_applicable; D142 added `graded`). A span is the sentence
#    or the clause in which the model answers the question. A trace can
#    hold several (the drafts of the answer). The things that the model
#    sees inside a verdict sentence are nested `visual_evidence` or
#    `inference` spans, as in `street-v3`. The verdict of 1 text is a rule
#    of the analysis, not of the extractor (`f9-extraction-design.md`,
#    section 2.3): the label of the last span; `mixed` when that span is
#    `yes` or `no` and the text also holds the other one; `not_applicable`
#    only when no other label is there; `none` when the text has no
#    verdict span.
# b. The description names the F9 prompt. The caption sentence and rule 5
#    (captions) are gone: no caption answer enters this arm.
# c. 8 new examples from the F9 answers, 1 for each input shape: a trace
#    start (no verdict), a plan-only chunk (`none`), a trace end (2 `no`
#    drafts), a conditional answer (`mixed`, with a `no` and a `yes` for 2
#    kinds of diner), a clear `yes`, a graded answer (`mixed`, a
#    conditional `yes`, then `graded`), a Llama answer that sees no
#    restaurant (`not_applicable`), and a short Llama `no`. Built by
#    `research/scripts/f9/build_subj_cue_examples.py` (to write; the draft came from
#    a scratchpad builder with the same span rules as
#    `build_single_v2_examples.py`). U+2011 is "-" in the example texts, as
#    in the x2 inputs.
#
# Example texts (model|case|image_idx|field). The smoke set of the arm must
# not hold these doc_ids:
#   gemma-4-12b|restaurant_subj|9953|reasoning
#   gemma-4-31b|restaurant_subj|7530|reasoning
#   qwen3.8-27b|restaurant_subj|7530|reasoning
#   gemma-4-31b|restaurant_subj|7880|response
#   qwen3.5-9b|restaurant_subj|9743|response
#   qwen3.8-27b|restaurant_subj|8244|response
#   llama-3.2-90b|restaurant_subj|4721|response
#   llama-3.2-11b|restaurant_subj|7530|response
#
# The settings are those of `single-v2` (D130). The input is
# `data/f4_traces/extract_input/f4_restaurant_subj_x2.parquet`.
#
# Warning: raise `schema_version` when you change a class, an attribute, a
# value list, or an example. Never edit a version in place.
#
# Warning: keep `attribute_values` inside `VOCABULARY` in
# `research/notebooks/cvpr/_extractions.py`. The class `verdict` is new there.

name: urban_cues_single
schema_version: single-subj-v1

# Chunks of 6,000 characters. The library cuts at sentence ends and puts the
# last 600 characters of the chunk before into the prompt as context. 503 of
# the 40,000 F9 restaurant traces are longer than 6,000 characters.
max_char_buffer: 6000
context_window_chars: 600

# About 5,500 tokens of instructions and examples, about 1,600 tokens of
# chunk and context, and the answer.
max_model_len: 32768

batch_length: 512
extraction_passes: 1
temperature: 0.0

# The cap for 1 chunk. A loop stops here and loses only its chunk.
max_tokens: 6144

repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true

attribute_values:
  visual_evidence:
    valence: [good, bad, neutral]
    category: [people, cleanliness, upkeep, greenery, light, signage, traffic,
               construction, commerce, architecture, color, activity, other]
  inference:
    kind: [wealth, class, safety, crime, demographic, upkeep, quality, atmosphere,
           business_type, neighborhood_character, popularity, location, time,
           brand_knowledge, institution_knowledge, other]
  person_reference:
    used_in_judgment: ['yes', 'no']
  image_artifact:
    kind: [blur, angle, occlusion, time_of_day, weather, other]
  uncertainty:
    reason: [illegible, out_of_view, identity, knowledge, other]
  verdict:
    label: ['yes', 'no', mixed, graded, not_applicable]

prompt_description: |
  You read text that a vision-language model wrote about one street-level
  photograph in New York City. The user asked the model "Does this look like
  a nice restaurant to eat at?". The text is the private reasoning of the
  model or its final answer, and it can be one part of a longer text.
  Extract what the model says. Do not judge the image yourself, and do not
  add anything the text does not say.

  Classes:

  - visual_evidence: a concrete thing that the model says it sees.
    valence: good, bad, neutral. category: people, cleanliness, upkeep,
    greenery, light, signage, traffic, construction, commerce, architecture,
    color, activity, other.
  - inference: a claim that the photograph cannot show, which the model draws
    from what it sees or from what it knows. kind: wealth (price, high-end,
    cheap), class, safety, crime, demographic (who lives, works, or eats
    there), upkeep, quality (of the food or the service), atmosphere (the
    feel of the place), business_type (the cuisine or the kind of business),
    neighborhood_character (the kind of area), popularity, location (the
    street, the neighborhood, the city), time (hours, era, season),
    brand_knowledge (facts about this business or its chain),
    institution_knowledge (facts about a building or an institution), other.
  - person_reference: a statement about the people in the photograph.
    used_in_judgment: yes when the model uses them to judge the place.
  - image_artifact: a statement about the photograph itself, not the place.
    kind: blur, angle, occlusion, time_of_day, weather, other.
  - uncertainty: words that hedge or say the model cannot tell. reason:
    illegible (cannot read a text), out_of_view, identity (not sure what or
    which place it is), knowledge (not sure of a fact past the image), other.
  - verdict: the sentence or the clause in which the model answers the
    question. label: yes (a nice restaurant), no (not a nice restaurant),
    mixed (the answer depends on the diner or on the meaning of "nice", or
    the model gives points for and against and takes no side), graded (one
    middle judgment with no yes and no no: "decent", "okay", "perfectly
    fine", "nothing special", "not bad but not great"), not_applicable (the
    model says that the photograph shows no restaurant). An answer for one
    kind of diner only ("If you want fine dining, then no") is a verdict
    span with that label. A draft of the answer in a trace is a verdict
    span.
  - none: the text holds nothing above. Extract its first 3 to 6 words as
    `none`, and nothing else.

  Rules:

  1. Copy each span from the text, character for character, in the order of
     the text. Never paraphrase, and never join two parts of the text.
  2. Do not extract the same span two times. A span can lie inside a longer
     span when it has a different class.
  3. Extract nothing from the request that a trace repeats, from headings,
     or from the plan of the answer.
  4. An inference span is 1 claim, about 25 words at most. A long
     deliberation gives 1 span for each claim.
  5. Extract every verdict statement, in the order of the text. A verdict
     span is 1 sentence or 1 clause. A thing that the model sees inside a
     verdict sentence is also a visual_evidence or inference span, inside
     the verdict span. A summary that only names the kind of place ("it
     looks like a casual neighborhood spot") is an inference, not a
     verdict. A middle rating of the place as a place to eat ("a perfectly
     fine joint for a casual meal") is a verdict with label graded.
  6. The echo of the question is not a verdict. A "yes" or "no" about
     another thing ("Does it mention the location? Yes") is not a verdict.

