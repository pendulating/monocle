# qwen3.6-27b with its released J++ lens (koayon/jpp-lenses).
# GPU: 2 GPUs of 96 GB: 108 GB of weights at fp32 (decision D154: fp32).
key: qwen3.6-27b
model_dir: ${oc.env:IMAGE_FORWARD_MODEL_ZOO}/Qwen3.6-27B
lens_path: ${oc.env:IMAGE_FORWARD_PROJECT_ROOT}/outputs/_monocle/jlens/jpp/qwen3.6-27b/lens.pt
# The number of blocks. The reads use range(0, n_layers, readout.layer_step).
n_layers: 63
dtype: float32
# cuda:0 for 1 GPU. auto splits the model over the GPUs of the job.
device_map: auto
launcher: slurm_gpu_preempt_2x_big
