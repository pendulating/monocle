[project]
name = "trashbot-annotator"
version = "0.1.0"
description = "TrashBot deployment footage annotator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "openai>=1.60",
    "marimo>=0.23.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
trashbot-annotate = "trashbot_annotator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trashbot_annotator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
