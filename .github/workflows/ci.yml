# CI of monocle: the tests with no GPU, no SLURM and no local data, and ruff.
#
# uv fetches image-forward (a private repo) over SSH. The secret
# IMAGE_FORWARD_DEPLOY_KEY holds the private part of a read-only deploy key of
# pendulating/image-forward.
name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The locked CUDA wheels (torch, vLLM, FlashInfer) need about 12 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: SSH key for image-forward
        env:
          DEPLOY_KEY: ${{ secrets.IMAGE_FORWARD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra urban --extra research --extra notebooks
      - name: Tests
        run: uv run --frozen pytest -q -m "not gpu and not slurm and not data"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      # pyproject.toml [tool.ruff] sets the rules: syntax errors and undefined names.
      - name: Ruff
        run: uvx ruff check .
