# CI of the framework: the tests with no GPU, no SLURM and no local data, and
# the lint gates. See vlm-narratives-docs/repo-cleanup-plan.md (phase 5).
name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The locked CUDA wheels (torch, vLLM, FlashInfer) need about 12 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: >
          uv sync --frozen
          --extra wandb --extra speech --extra embed --extra langextract
          --extra urban --extra research --extra notebooks
      - name: Tests
        run: uv run --frozen pytest -q -m "not gpu and not slurm and not data"
      # Pyright checks the files that are clean now. Add a file when its errors are gone.
      # (The full framework has about 270 old errors: run `pyright` to see them.)
      - name: Pyright (clean files)
        run: >
          uv run --frozen pyright
          hydra_plugins dagspaces/_template
          dagspaces/common/dagspace_factory.py dagspaces/common/dagspace_cli.py
          dagspaces/common/stage_utils.py dagspaces/common/cli_utils.py
          scripts/new_dagspace.py scripts/make_image_table.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # pyproject.toml [tool.ruff] sets the rules: syntax errors and undefined names.
      - name: Ruff
        run: uvx ruff check .
