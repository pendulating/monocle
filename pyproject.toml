[project]
name = "mllmsci"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.42.47",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "jinja2>=3.1.6",
    "ninja>=1.13.0",
    "packaging>=26.0",
    "pandas>=1.3,<3",
    "psutil>=7.2.2",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.0.0",
    "vllm>=0.19.0",
    "transformers>=5.5.0",
    "setuptools>=80.10.2",
    "torch>=2.9.1",
    "wandb>=0.24.2",
    "datasets>=4.0.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "geopandas>=1.1.2",
    "flash-attn>=2.8.3",
    "trueskill>=0.4.5",
    "statsmodels>=0.14.6",
    "osmnx>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "rasterio>=1.3.0",
    "polars>=1.39.3",
    "polars-st>=0.7.0",
    "peft>=0.14.0",
    "timm>=1.0.15",
    "webdataset>=0.2.100",
    "marimo>=0.23.3",
    "duckdb>=1.5.4",
    "plotly>=6.9.0",
    "silero-vad>=5.1",
    "wordcloud>=1.9.6",
    "nltk>=3.9.4",
]

[project.optional-dependencies]
# Ray is only needed for the Cambrian-13B sidecar inference path
cambrian = [
    "ray>=2.53.0",
]

# LangExtract turns a reasoning trace into typed, grounded extractions
# (dagspaces/common/langextract_backend.py).
#
# WARNING: install this group with --no-deps. A plain install pulls
# google-genai and google-cloud-storage, which this project never calls, and
# moves websockets down from 17.0.1 to 16.1.1.
#
#   uv pip install --no-deps langextract absl-py ml-collections more-itertools
#
# The 3 packages beside langextract are the only runtime imports it needs that
# the base environment does not already hold.
langextract = [
    "langextract>=1.6.0",
    "absl-py>=2.5.0",
    "ml-collections>=1.1.0",
    "more-itertools>=11.1.0",
]


[tool.setuptools.packages.find]
include = ["dagspaces*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
no-build-isolation-package = ['flash-attn', 'setuptools']
# vllm 0.19.0 caps transformers<5 but we need >=5.5.0 for latest model support.
# The cap is overly conservative — trawler runs this combination successfully.
override-dependencies = [
    "transformers>=5.5.0",
]
