[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monocle"
version = "0.1.0"
description = "Research on how vision-language models judge urban images: experiments, street-view data and the J-lens. Runs on image-forward."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The framework: dagspaces, launchers, scripts. See [tool.uv.sources].
    "image-forward[wandb,embed,langextract,speech]",
]

[project.optional-dependencies]
# The street-view code in sv/ (Cyclomedia, NYC).
urban = [
    "geopandas>=1.1.2",
    "shapely>=2.0",
    "polars>=1.39.3",
    "polars-st>=0.7.0",
    "duckdb>=1.5.4",
    "osmnx>=2.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "matplotlib>=3.10.8",
]
# The research code in research/: the J-lens (research/monocle), the experiment
# scripts, the research dagspaces.
research = [
    "monocle[urban]",
    "peft>=0.14.0",
    "timm>=1.0.15",
    "statsmodels>=0.14.6",
    "trueskill>=0.4.5",
    "webdataset>=0.2.100",
    "networkx>=3.0",
    "opencv-python-headless>=4.10",
    "huggingface-hub>=1.0",
    # The J-lens (research/monocle): a fork of anthropics/jacobian-lens with
    # lens metadata and a device cache. Apache-2.0.
    "jlens @ git+https://github.com/pendulating/jacobian-lens@7201af51a6b0206cc5cbf963cd78605b3ae9e1f1",
]
# The analysis notebooks in research/notebooks/.
notebooks = [
    "marimo>=0.23.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "plotly>=6.9.0",
    "wordcloud>=1.9.6",
]
# The Cambrian-13B sidecar inference path.
cambrian = ["ray>=2.53.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyright>=1.1.400",
    "ruff>=0.8",
]

# setup.py gives the package list (see the note there).
[tool.setuptools.package-data]
research = ["**/*.yaml", "**/*.json", "**/*.jinja"]
sv = ["**/*.yaml", "**/*.json"]

# The project settings of image-forward: the config roots of this repo, in
# search order. See docs/project-repos.md in image-forward.
[tool.image-forward]
conf-roots = ["site/conf", "sv/conf", "sv/nyc/conf", "research/conf"]

[tool.uv]
# The vLLM 0.25 cu129 wheel is for Linux x86_64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# uv reads [tool.uv.sources] and the constraints of the root project only. Thus
# this file repeats those of image-forward. Keep them the same.
# The CUDA stack: the vLLM 0.25 binary wheel links against these versions.
constraint-dependencies = [
    "triton==3.6.0",
    "flashinfer-python==0.6.13",
    "flashinfer-cubin==0.6.13",
    "transformers==5.13.1",
    "tokenizers==0.22.2",
    "huggingface-hub==1.23.0",
    "safetensors==0.8.0",
    "compressed-tensors==0.17.0",
    "xgrammar==0.2.3",
    "numpy==2.3.5",
]

# flash-attn: give the metadata here, so that `uv lock` does not build the
# package. The build gets the torch of the environment.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3.post1"
requires-dist = ["torch", "einops"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }, "ninja", "packaging", "psutil"]

[tool.uv.sources]
# The framework. Change the rev to take a new image-forward commit, then run
# `uv lock`. On the cluster, the site venv holds an editable install of the
# image-forward checkout instead (see README.md).
image-forward = { git = "ssh://git@github.com/pendulating/image-forward", rev = "b6a85f093270ec41028a279c8065e64201569a36" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.25.0/vllm-0.25.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
line-length = 100
# research/ and sv/ have their own style for now.
extend-exclude = ["research", "sv", "tools", "artificial-aesthetic", "sub", "multirun", "outputs", "data", "archive"]

[tool.ruff.lint]
# The CI gate: syntax errors and undefined names.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests", "sv"]
markers = [
    "gpu: the test needs a CUDA GPU",
    "slurm: the test submits a SLURM job",
    "data: the test reads data that is not in git (the model zoo, multirun/, data/)",
]
