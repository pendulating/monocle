[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-forward"
version = "0.1.0"
description = "Run vision-language models over large image sets on a SLURM cluster: Hydra pipelines of vLLM stages."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The core: the framework in dagspaces/. The default environment is vLLM 0.25
# with CUDA 12.9. [tool.uv.sources] gives the cu129 builds of torch and vLLM.
dependencies = [
    "vllm==0.25.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "torchcodec>=0.14",
    "transformers>=5.5.3",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "submitit>=1.5",
    "omegaconf>=2.3",
    "jinja2>=3.1.6",
    "pandas>=2.2,<3",
    "pyarrow>=23.0.0",
    "pillow>=11",
    "numpy>=2",
    "python-dotenv>=1.0.0",
    "psutil>=7.2.2",
    "cloudpickle>=3",
    "pyyaml>=6",
    "tqdm>=4.66.0",
    "safetensors>=0.6.2",
]

[project.optional-dependencies]
# W&B logs a run only when WANDB_ENTITY is set (see server.env.example).
wandb = ["wandb>=0.24.2"]
# The speech dagspace: voice activity detection.
speech = ["silero-vad>=5.1"]
# The embed dagspace: the browser index and the query projection.
embed = ["scikit-learn>=1.5.0", "scipy>=1.14.0"]
# flash-attn has no wheel for torch 2.11 + cu129. uv builds it from source
# (about 1 hour). Only the transformers fallback path of vllm_inference uses it.
flash-attn = ["flash-attn>=2.8.3"]
# LangExtract turns a reasoning trace into typed, grounded extractions
# (dagspaces/common/langextract_backend.py).
#
# WARNING: a plain install pulls google-genai and google-cloud-storage, which
# this project never calls. To skip them, install the group with --no-deps:
#
#   uv pip install --no-deps langextract absl-py ml-collections more-itertools
langextract = [
    "langextract>=1.6.0",
    "absl-py>=2.5.0",
    "ml-collections>=1.1.0",
    "more-itertools>=11.1.0",
]
# The street-view code in sv/ (Cyclomedia, NYC).
urban = [
    "geopandas>=1.1.2",
    "shapely>=2.0",
    "polars>=1.39.3",
    "polars-st>=0.7.0",
    "duckdb>=1.5.4",
    "osmnx>=2.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "matplotlib>=3.10.8",
]
# The research code in research/: monocle, the experiment scripts, the
# research dagspaces.
research = [
    "image-forward[wandb,embed,urban]",
    "peft>=0.14.0",
    "timm>=1.0.15",
    "statsmodels>=0.14.6",
    "trueskill>=0.4.5",
    "webdataset>=0.2.100",
    "networkx>=3.0",
    "opencv-python-headless>=4.10",
    "huggingface-hub>=1.0",
    # The J-lens (research/monocle): a fork of anthropics/jacobian-lens with
    # lens metadata and a device cache. Apache-2.0.
    "jlens @ git+https://github.com/pendulating/jacobian-lens@7201af51a6b0206cc5cbf963cd78605b3ae9e1f1",
]
# The analysis notebooks in research/notebooks/.
notebooks = [
    "marimo>=0.23.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "plotly>=6.9.0",
    "wordcloud>=1.9.6",
]
# The Cambrian-13B sidecar inference path.
cambrian = ["ray>=2.53.0"]

[project.scripts]
# dagspace vqa pipeline=...  is the same as  python -m dagspaces.vqa.cli pipeline=...
dagspace = "dagspaces.common.dagspace_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyright>=1.1.400",
    "ruff>=0.8",
]

# setup.py gives the package list (see the note there).
[tool.setuptools.package-data]
dagspaces = ["**/*.yaml", "**/*.json", "**/*.jinja", "**/*.md"]

[tool.uv]
# The editable install puts the repo root on sys.path (a .pth file). Hydra finds
# plugins with pkgutil, and pkgutil cannot list the namespace hydra_plugins
# through the path hook of the default editable mode.
config-settings-package = { image-forward = { editable_mode = "compat" } }
# The vLLM 0.25 cu129 wheel is for Linux x86_64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The CUDA stack: the vLLM 0.25 binary wheel links against these versions.
constraint-dependencies = [
    "triton==3.6.0",
    "flashinfer-python==0.6.13",
    "flashinfer-cubin==0.6.13",
    "transformers==5.13.1",
    "tokenizers==0.22.2",
    "huggingface-hub==1.23.0",
    "safetensors==0.8.0",
    "compressed-tensors==0.17.0",
    "xgrammar==0.2.3",
    "numpy==2.3.5",
]

# flash-attn: give the metadata here, so that `uv lock` does not build the
# package. The build gets the torch of the environment.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3.post1"
requires-dist = ["torch", "einops"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }, "ninja", "packaging", "psutil"]

[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.25.0/vllm-0.25.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
line-length = 100
# The framework only. research/ and sv/ have their own style for now.
extend-exclude = ["research", "sv", "tools", "artificial-aesthetic", "sub", "multirun", "outputs", "data", "archive"]

[tool.ruff.lint]
# The CI gate: syntax errors and undefined names. Add more rules step by step.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# The framework tests are in tests/. The street-view tests are in sv/.
testpaths = ["tests", "sv"]
markers = [
    "gpu: the test needs a CUDA GPU",
    "slurm: the test submits a SLURM job",
    "data: the test reads data that is not in git (the model zoo, multirun/, data/)",
]
