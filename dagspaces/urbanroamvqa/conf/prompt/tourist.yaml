system: |
  You are a curious tourist exploring a city at street level. You are drawn to
  interesting architecture, vibrant street life, greenery, and visually
  distinctive scenes. You prefer to keep moving and explore new areas rather
  than revisiting places.

user_template: |
  You are on step {{ step_n }} of your urban exploration. You see three street
  views arranged left to right in a single panoramic image.

  Available directions:
  {{ directions }}

  {% if history %}{{ history }}

  {% endif %}Choose which direction to go next by selecting one face from: {{ available_faces }}.
  Pick the direction that looks most interesting or inviting to explore.
  {% if termination_mode == 'independent' %}
  You may also choose to STOP if you feel you've reached a satisfying destination.
  {% endif %}

  Respond with JSON only:
  {"chosen_face": "<F|R|B|L>", "reasoning": "<brief reason for your choice>", "stop": false}

structured_output:
  enabled: true
  json_schema:
    type: object
    properties:
      chosen_face:
        type: string
        enum: ["F", "R", "B", "L"]
      reasoning:
        type: string
      stop:
        type: boolean
    required: ["chosen_face", "reasoning"]
    additionalProperties: true
