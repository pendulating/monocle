# @package _global_
# VISUAL TOKEN BUDGET PROBE — gemma-4-12b, greedy proxy path.
#
# Question: do the pairwise judgments need the 280-token budget, or does a
# smaller budget give the same labels for half the prefill?
#
# Google's card recommends a low budget for classification and a high budget
# for fine detail (gemma-4 model card, "Variable Image Resolution"). A pairwise
# ordinal judgment is a classification by its output, but the evidence is a
# facade, a pavement, or a shopfront. Only a measurement settles it.
#
# ─── What the knob does (measured 2026-08-20, 1024x1024 cyclomedia face) ─────
# | max_soft_tokens | tokens/image | tokens/pair | prompt | pixels for a face |
# |-----------------|--------------|-------------|--------|-------------------|
# | 70              | 64           | 128         | ~240   | 384 x 384         |
# | 140             | 121          | 242         | ~354   | 528 x 528         |
# | 280 (today)     | 256          | 512         | 624    | 768 x 768         |
# | 560             | 529          | 1058        | ~1170  | 1104 x 1104       |
# | 1120            | 1089         | 2178        | ~2290  | 1584 x 1584       |
#
# The count is not the budget: the processor rounds the resize down to whole
# 48-pixel cells (patch 16 x pooling 3), thus a square face lands under the
# cap. Each soft token is one 48-pixel cell.
#
# vLLM accepts ONLY these five values (`_SUPPORTED_SOFT_TOKENS`,
# vllm/model_executor/models/gemma4_mm.py). Any other number falls back to the
# model default without an error.
#
# ─── Controls ────────────────────────────────────────────────────────────────
# `max_model_len` stays 3,072 for every arm, thus the arms differ ONLY in the
# budget. A small budget does not need the window, but a shared window keeps
# the comparison clean. Cut the window with the budget only AFTER a winner
# exists.
#
# LAYOUT: `interleaved_labels`, the production layout. The layout probe of the
# same day is a separate question — do not vary both at once.
#
# LAUNCHER: klara_1x, NEVER klara_2x.
#
# PAIRS: 64, a deterministic seed-777 prefix. Every arm gets the SAME 64 pairs,
# thus the labels compare pair by pair.
#
# ─── Launch ──────────────────────────────────────────────────────────────────
#   export HYDRA_SWEEP_DIR=multirun/budget_probe_gemma12b
#   .venv-mllmsci-vllm025cu129/bin/python -m dagspaces.pairwisevqa.cli \
#       --multirun +sweep=budget_probe_gemma12b \
#       model.engine_kwargs.mm_processor_kwargs.max_soft_tokens=70,140,280
#
# ─── How to read it ──────────────────────────────────────────────────────────
# | Signal                     | What it tells you                            |
# |----------------------------|----------------------------------------------|
# | agreement with the 280 arm | whether the small budget keeps the judgment  |
# | NotSure rate               | a rise means the model lost the evidence     |
# | Much* rate                 | a fall means the judgment went flat          |
#
# Warning: agreement alone does not prove a budget is safe. A model that cannot
# see the detail can still guess the same side. Read the traces of the winner
# in thinking mode before you flip the battery.
#
# Warning: these runs are NOT canonical. `notebooks/cvpr/_provenance.py` drops
# this sweep name.

model:
  engine_kwargs:
    mm_processor_kwargs:
      # The default arm. The launch command sweeps this key over the ladder.
      max_soft_tokens: 280

sampling_params_vqa:
  max_tokens: 128

prompt:
  # The production layout for this arch (moved 2026-08-20).
  # Do not vary it here.
  image_layout: images_then_labels

pair_sampler:
  max_pairs: 64

pipeline:
  graph:
    nodes:
      pairwise:
        launcher: slurm_gpu_klara_1x   # NOT klara_2x

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 3
  sweeper:
    params:
      model: gemma-4-12b/instruct
      pipeline: pairwise_schools_mvp
