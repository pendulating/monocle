  - extraction_class: inference
    extraction_text: The restaurant has a cozy and intimate atmosphere
    attributes:
      kind: atmosphere
  - extraction_class: inference
    extraction_text: a warm and inviting interior that reflects the traditional Spanish cuisine it serves
    attributes:
      kind: brand_knowledge
  - extraction_class: visual_evidence
    extraction_text: a yellow awning
