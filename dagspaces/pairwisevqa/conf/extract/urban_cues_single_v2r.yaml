# @package extract
# single-v2r (D130): the RETRY pass of `urban_cues_single_v2.yaml`, written by
# `research/scripts/f4/x2_retry.py schemas`. The same text; the positive examples are in
# reverse order, and each `none` example stays at its place. It reads only the
# texts that got a copy of an example in the first pass.
name: urban_cues_single
schema_version: single-v2r
max_char_buffer: 6000
context_window_chars: 600
max_model_len: 32768
batch_length: 512
extraction_passes: 1
temperature: 0.0
max_tokens: 6144
repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true
attribute_values:
  visual_evidence:
    valence:
    - good
    - bad
    - neutral
    category:
    - people
    - cleanliness
    - upkeep
    - greenery
    - light
    - signage
    - traffic
    - construction
    - commerce
    - architecture
    - color
    - activity
    - other
  inference:
    kind:
    - wealth
    - class
    - safety
    - crime
    - demographic
    - upkeep
    - quality
    - atmosphere
    - business_type
    - neighborhood_character
    - popularity
    - location
    - time
    - brand_knowledge
    - institution_knowledge
    - other
  person_reference:
    used_in_judgment:
    - 'yes'
    - 'no'
  image_artifact:
    kind:
    - blur
    - angle
    - occlusion
    - time_of_day
    - weather
    - other
  uncertainty:
    reason:
    - illegible
    - out_of_view
    - identity
    - knowledge
    - other
prompt_description: "You read text that a vision-language model wrote about one street-level\nphotograph\
  \ in New York City. The user asked the model about a restaurant\nin the photograph, or asked for an\
  \ Instagram caption. The text is the\nprivate reasoning of the model or its final answer, and it can\
  \ be one part\nof a longer text. Extract what the model says. Do not judge the image\nyourself, and\
  \ do not add anything the text does not say.\n\nClasses:\n\n- visual_evidence: a concrete thing that\
  \ the model says it sees.\n  valence: good, bad, neutral. category: people, cleanliness, upkeep,\n \
  \ greenery, light, signage, traffic, construction, commerce, architecture,\n  color, activity, other.\n\
  - inference: a claim that the photograph cannot show, which the model draws\n  from what it sees or\
  \ from what it knows. kind: wealth (price, high-end,\n  cheap), class, safety, crime, demographic (who\
  \ lives, works, or eats\n  there), upkeep, quality (of the food or the service), atmosphere (the\n \
  \ feel of the place), business_type (the cuisine or the kind of business),\n  neighborhood_character\
  \ (the kind of area), popularity, location (the\n  street, the neighborhood, the city), time (hours,\
  \ era, season),\n  brand_knowledge (facts about this business or its chain),\n  institution_knowledge\
  \ (facts about a building or an institution), other.\n- person_reference: a statement about the people\
  \ in the photograph.\n  used_in_judgment: yes when the model uses them to judge the place.\n- image_artifact:\
  \ a statement about the photograph itself, not the place.\n  kind: blur, angle, occlusion, time_of_day,\
  \ weather, other.\n- uncertainty: words that hedge or say the model cannot tell. reason:\n  illegible\
  \ (cannot read a text), out_of_view, identity (not sure what or\n  which place it is), knowledge (not\
  \ sure of a fact past the image), other.\n- none: the text holds nothing above. Extract its first 3\
  \ to 6 words as\n  `none`, and nothing else.\n\nRules:\n\n1. Copy each span from the text, character\
  \ for character, in the order of\n   the text. Never paraphrase, and never join two parts of the text.\n\
  2. Do not extract the same span two times. A span can lie inside a longer\n   span when it has a different\
  \ class.\n3. Extract nothing from the request that a trace repeats, from headings,\n   or from the plan\
  \ of the answer.\n4. An inference span is 1 claim, about 25 words at most. A long\n   deliberation gives\
  \ 1 span for each claim.\n5. In a caption, extract what the caption says about this place: a name on\n\
  \   a sign, a thing in view, the kind of business or area, the feel, the\n   light. Skip hashtags and\
  \ lines that say nothing about this place.\n"
examples:
- text: 'The restaurant in the image is Manchego, a Spanish tapas restaurant located in the Greenpoint
    neighborhood of Brooklyn. It is situated on Manhattan Avenue, which is a popular street lined with
    shops and restaurants. The restaurant has a cozy and intimate atmosphere, with a warm and inviting
    interior that reflects the traditional Spanish cuisine it serves. The exterior of the restaurant is
    also charming, with a yellow awning and a small patio area where customers can dine al fresco. Overall,
    Manchego is a great spot for those looking to experience authentic Spanish flavors in a welcoming
    and stylish setting.

    '
  extractions:
  - extraction_class: inference
    extraction_text: a Spanish tapas restaurant
    attributes:
      kind: business_type
  - extraction_class: inference
    extraction_text: located in the Greenpoint neighborhood of Brooklyn
    attributes:
      kind: location
  - extraction_class: inference
    extraction_text: It is situated on Manhattan Avenue
    attributes:
