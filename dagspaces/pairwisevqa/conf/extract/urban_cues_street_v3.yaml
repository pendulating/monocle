- text: |
    The user wants photographic angle suggestions for this scene. Let me look carefully at what's in the frame and think about what makes a composition work here.

    What's in the image: A large spreading tree dominates the center and upper portion, its canopy filling most of the sky. Behind it are brick houses—residential, looks like a working-class neighborhood. There's a black SUV (Audi) parked in a driveway on the right, three trash/recycling bins (dark, dark, blue) in front of the tree base. In the foreground bottom-left is the glossy black roof and rear window of another car, very close to the camera. Power lines cross the upper left. There's dappled sunlight, blue sky peeking through leaves. Stairs and porches on the houses. A small round window on the right brick house.

    The current framing is a bit cluttered—the foreground car roof cuts in awkwardly, the bins are mid-frame and a bit distracting, the tree is the star but it's competing with the cars.
