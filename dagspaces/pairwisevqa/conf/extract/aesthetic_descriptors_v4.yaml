# @package extract
# Aesthetic descriptor schema, version 4 (2026-10-25), for the street
# photography case (D120). Claude drafted it; the user set its rule (D122)
# and has not reviewed the text yet (2026-10-25).
#
# Changes from version 3:
# - The intro names the angle prompt ("Look and tell me a good angle to take
#   a picture from.").
# - A new attribute, `target` (place, photo). The answers to the angle
#   prompt describe the planned photo ("a dramatic, almost industrial
#   feel"). The look and the mood of that photo are descriptors with target
#   photo; the words about the place get target place (D122). Camera
#   technique stays out (rule 5).
# - An 8th example: qwen3.5-9b, street image 48, after the llama-3.2-90b
#   example. Every other example gets target place.
#
# The restaurant run stays on version 3. A version 3 row and a version 4 row
# never pool; Track C and Track V compare models inside 1 case.
#
# Version 3 header:
#
# Aesthetic descriptor schema, version 3 (2026-10-25). Claude drafted it for
# the descriptor analysis (D109 to D115). The user reviewed the smoke output
# of version 2 and set the rule of version 3 (D113).
#
# Changes from version 2, after the smoke run of 120 texts (job 94517):
# - When a descriptor qualifies a building, a street, a block, or a
#   neighborhood, extract only the descriptor (D113). Version 2 gave whole
#   phrases ("classic red brick tenement-style building"). Rule 4, the head
#   rule, the slot rule, and 2 examples change: "strip-mall-style"
#   (qwen3.8-27b, image 577), and "classic", "urban", "historic" (gemma-4-12b,
#   image 514).
# - The slots that name a thing ("streets", "shops") stay as they are (D114).
#
# Changes from version 1, after the smoke run of 120 texts (job 94507;
# 1,020 spans, 94.6% quotable):
# - The extractor copied all 11 spans of the last example (llama-3.2-90b)
#   into 2 long restaurant traces with few descriptors. The example with few
#   descriptors (qwen3.8-27b, image 577) is now the last one; the
#   llama-3.2-90b example moves to the 3rd place.
# - The extractor wrote "-" for the non-breaking hyphen (U+2011) of the
#   qwen3.8-27b texts, thus 11 spans did not align. The input
#   (`research/scripts/f4/build_descriptor_input.py`) and the example texts now hold
#   "-". The length of each text does not change, thus the offsets stay valid.
# - Rule 1: keep the quote marks inside a span ('"foodie" vibes') and the
#   plural as written. Version 1 dropped both in about 6 spans.
# - Rule 4: a thing with only its color, its material or the weather
#   ("green awning", "clear sky", "brick building") is a plain observation.
#
# Purpose: the cue run (`urban_cues_single_v1`) puts about half of the
# inference spans in `kind: other`. That attribute is too coarse. This schema
# isolates the words that carry the aesthetic judgment:
#
# - Track C: the signature vocabulary of each model (the `head` values, inside
#   the inference and visual_evidence spans of the cue run).
# - Track V: the vibe words (`vibe: yes`), over the full texts, traces
#   included.
#
# 1 class, `descriptor`: a word or short phrase with which the text
# characterizes the place or the scene. Attributes:
#
# | Attribute | Kind | Use |
# |-----------|------|-----|
# | `head` | free | the plain form that the analysis counts |
# | `vibe` | yes, no | Track V |
# | `slot` | free | the frame noun ("vibe", "feel", "atmosphere"), or none |
# | `aspect` | enum | a coarse filter only |
# | `negated` | yes, no | "isn't flashy" |
#
# There is no fixed list of frame nouns (D112). The extractor decides from
# the text what is a frame noun, and writes it in `slot`. The rule text gives
# examples, not a list.
#
# Input: the 19,956 F4 texts of the cue run (`f4_restaurant.parquet`,
# `f4_caption.parquet`): the reasoning traces and the final answers of 6
# models, 2 cases, 1,000 images.
#
# A text can hold no descriptor (an echo, a plain list of facts), thus
# `require_extraction` is false, and the 1st example is a negative example
# (the caption-v3 lesson: the last example must not be the empty one).
#
# Every `extraction_text` appears in its own `text` word for word.
# `research/scripts/f4/build_descriptor_examples.py` builds each span as a slice of
# its text and prints the examples block. Change an example there.
#
# Warning: raise `schema_version` when you change the class, an attribute, a
# value list, a rule, or an example. Never edit a version in place.

name: aesthetic_descriptors
schema_version: descriptors-v4

# The settings of `urban_cues_single_v1`: the same input, thus the same
# longest text (55,231 characters), and the same torch.compile cache.
max_char_buffer: 60000
max_model_len: 49152

batch_length: 512
extraction_passes: 1
temperature: 0.0
max_tokens: 16384
use_guided_json: true
require_extraction: false

# `head` and `slot` are free strings on purpose (D112).
attribute_values:
  descriptor:
    vibe: ['yes', 'no']
    aspect: [appearance, atmosphere, social_register, business_type, figurative, other]
    negated: ['yes', 'no']
    target: [place, photo]

prompt_description: |
  You read text that a vision-language model wrote about one street-level
  photograph of a place in New York City: a restaurant, a shop, or a
  street. The user asked the model about the restaurant, asked for an
  Instagram caption, or asked: "Look and tell me a good angle to take a
  picture from." The text is the private reasoning of the model, or its
  final answer. Extract the descriptors: the words and short phrases with
  which the text characterizes the place or the scene, or the look and the
  mood of the photograph that the model suggests. Do not judge the image
  yourself, and do not add anything the text does not say.

  A descriptor tells how the place looks (rustic, stylish, weathered), how it
  feels (cozy, gritty, laid-back), whom it is for or what standing it has
  (local, upscale, neighborhood spot), what kind of place it is (gastropub,
  casual bistro, comfort food), or it is a figurative line about it (hidden
  gem, old brick doing the night shift).

  Use exactly this class:

  - descriptor: 1 descriptor.
    attributes:
    - head: the descriptor in plain form. Write it in lower case and in the
      singular. Leave out an article, an intensifier ("very", "slightly",
      "little"), a hedge, and the frame noun (see slot). Keep a noun that
      names a kind of business or venue, or a food or a drink ("casual
      eatery", "neighborhood spot", "creative cocktail"). Split the words of a hashtag ("#GritAndGrace"
      gives "grit and grace"). Never put a synonym in place of a word.
    - vibe: yes when the descriptor names the mood, the feel, or the energy
      of the place (cozy, buzzing, laid-back, gritty). Also yes when the text
      frames the descriptor as a vibe, a feel, an atmosphere, a mood, or a
      sense. no when the descriptor only tells how the place looks, what kind
      of place it is, or what quality its food has.
    - slot: the frame noun that the text attaches the descriptor to, in
      lower case and in the singular, or none. A frame noun names a kind of
      impression, not a kind of place or a thing. For example: "vibe" in
      "local vibe", "feel" in "bar feel", "sense" in "a sense of secrecy",
      "dining experience" in "unique dining experience", or a heading such as
      "Atmosphere:" over a list of words. These are examples, not a list.
      Decide from the text. A noun that names a kind of business or venue
      (spot, eatery, bistro, gem) is part of the head, not a slot.
    - aspect: appearance (how it looks), atmosphere (how it feels),
      social_register (whom it is for, its class, its standing),
      business_type (the kind of business, its cuisine, what it serves),
      figurative (a metaphor, an image, a line of poetry), other.
    - negated: yes when the text says that the place is not so ("isn't a
      flashy restaurant", "no fancy facade"), else no.
    - target: place when the descriptor characterizes the place or the
      scene. photo when it characterizes the photograph that the model
      suggests: its look, its mood, or the name the model gives a shot
      ("a moody post", "a dramatic, almost industrial feel", "The 'Grandeur'
      Shot").

  Every attribute value of vibe, aspect, negated, and target must be one of
  the values listed. Never invent a value.

  Rules:

  1. Copy each extraction from the text, character for character. Never
     paraphrase, never join two parts of the text, and never shorten. Keep
     the quote marks inside the span ('"foodie" vibes') and keep a plural as
     written ("hidden gems"); only the head is singular. Extract only from
     this text. Never copy a span from the examples.
  2. The span is the shortest phrase that holds the descriptor. When a frame
     noun follows the descriptor directly, include it ("cozy atmosphere",
     "local vibe"). For a figurative line, take the phrase that holds the
     image, not the full sentence.
  3. Extract each quality as 1 extraction: "cozy, intimate" gives 2. Keep a
     fixed compound as 1 (low-key, old-school, lived-in, tongue-in-cheek).
  4. A plain observation is not a descriptor: a color, a material, the
     light, the weather, a count, a size, an object, a part of a building
     (fire escape, brownstone, awning), a sign, a name, an address, a place
     name, a menu item. A thing with only its color, its material, its size
     or the weather is also a plain observation ("green awning", "clear
     sky", "multi-story brick building"). When a descriptor qualifies a
     building, a street, a block, or a neighborhood, extract only the
     descriptor: "classic red brick tenement-style building" gives "classic",
     "vibrant streets" gives "vibrant", and "strip-mall-style commercial
     block" gives "strip-mall-style". A noun that names a kind of business
     or venue (eatery, bistro, spot, gem) is not such a place; keep it.
     When the text gives a visual detail as evidence ("warm lighting
     suggests a cozy atmosphere"), extract the quality, not the detail.
  5. Extract words about the place or the scene (target place), and words
     about the look or the mood of the photograph that the model suggests
     (target photo). Skip camera technique: the angle, the position, the
     lens, the framing, a rule of composition, a setting, and advice on when
     to shoot ("low angle", "leading lines", "rule of thirds", "sense of
     depth", "wait for golden hour"). Skip praise of a photo with no look or
     mood in it ("a great shot"). Skip words about a caption and its style
     ("Short & Sweet", "punny", "cooler tone"), about the user and the
     feelings of the user, and about the task or the plan of the model ("I
     shouldn't call it the best"). A reasoning trace often opens with the
     request the model got ("The user wants...", "Analyze the Request").
     Extract nothing from that echo.
  6. Extract a hedged descriptor too ("seems like a neighborhood spot", "may
     have a playful vibe").
  7. Extract a descriptor the first time that the text uses it. Skip a later
     use with the same head, also when it comes back as a hashtag.
  8. Copy a hashtag whole, with the "#". A hashtag that names a place, the
     photograph, or a plain object gives no extraction.
  9. Extract in the order that the spans appear in the text. A text with no
     descriptor gives no extraction.

