    The storefronts to the left are mostly hidden behind the big tree. The nearest one has brick entry columns and a red **"ATM"** sign in the window, and the darker building on the far left has a small white sign on its awning that's too blurry for me to read. None of these show obvious food-service cues (no menu board, no dining seating, no restaurant name that I can make out).

