# A generic pairwise prompt: the default of the pairwisevqa dagspace.
# It compares 2 street-level images on a 5-point scale, with a NotSure label.
# Write a prompt of your own with the same keys: system, user_template and
# structured_output (the scoring reads the 5 labels below).
system: null

user_template: |
  Image A is the first image and Image B is the second image.
  Which place looks more pleasant to walk through?

  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore

  Interpret this as "the place in Image A is <label> pleasant to walk through
  than the place in Image B". Use "Same" when they look about the same.

structured_output:
  enabled: true
  # The stage adds not_sure_label to the labels and a line to the prompt.
  # A NotSure answer scores as NaN, not as "Same".
  allow_not_sure: true
  not_sure_label: NotSure
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    # false: guided decoding allows no other keys, so the output stays short.
    additionalProperties: false
