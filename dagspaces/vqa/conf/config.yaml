# Top-level Hydra config for VQA

defaults:
  - _self_
  - data: inputs
  - prompt: vqa
  - model: vllm_qwen3-30b
  - optional pipeline: null

experiment:
  name: VQA

runtime:
  debug: false
  sample_n: null
  output_root: null
  serialize_nested_json: true
  max_errored_blocks: 0
  streaming_io: false
  job_memory_gb: 32
  rows_per_block: 4000
  prompt_override_path: null
  suppress_child_warnings: true  # Suppress harmless multiprocessing resource_tracker warnings/errors
  # Multimodal options (optional, auto-detected from model if not set)
  # multimodal_enabled: false  # Force enable/disable multimodal mode
  # image_fallback: true  # Fallback to text-only if image loading fails (default: true)
  # VQA-specific options
  batch_inference: true  # Process multiple prompt+image pairs efficiently
  dynamic_prompts: false  # Future: allow per-sample prompts
  hierarchical_prompts: false  # Future: multi-step reasoning
  group_by_prompt: false  # Group same prompts together for efficiency (avoids retokenizing)

sampling_params:
  seed: 777
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  max_tokens: 16384

# VQA sampling parameters
sampling_params_vqa:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512  # Longer for detailed answers
  stop: []  # No specific stop tokens for VQA

wandb:
  enabled: true
  name_prefix: null
  project: ${oc.env:WANDB_PROJECT,VQA}
  entity: ${oc.env:WANDB_ENTITY,urbanekg}
  group: ${oc.env:WANDB_GROUP,""}
  table_sample_rows: 1000
  single_run: true


hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}



