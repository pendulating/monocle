# @package _global_
# The vqa stage on the 10 example images (examples/images/). The question of
# each image is in the `prompt` column of the table.
#
# In this process (a node with a GPU):
#   dagspace vqa -m hydra/launcher=local pipeline=example_images
# A monitor job and one GPU job on SLURM:
#   dagspace vqa -m pipeline=example_images runtime.stage_launcher=slurm_gpu_1x
defaults:
  - override /data: example_images
  - override /model: vllm_multimodal_qwen
  - override /prompt: vqa
  - _self_

experiment:
  name: VQA_EXAMPLE

runtime:
  # The launcher of the stage job. With null, the stage runs in the CLI process.
  stage_launcher: null

sampling_params_vqa:
  max_tokens: 128

pipeline:
  output_root: ${runtime.output_root}
  allow_partial: false
  graph:
    nodes:
      vqa:
        stage: vqa
        depends_on: []
        outputs:
          results: outputs/vqa/example_images.parquet
        overrides:
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
        launcher: ${runtime.stage_launcher}
        wandb_suffix: example_images
