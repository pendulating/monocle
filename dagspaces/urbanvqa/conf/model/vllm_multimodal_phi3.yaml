# Multimodal Model Configuration - Phi-3 Vision Models
# Optimized for microsoft/Phi-3.5-vision-instruct models

model_source: "microsoft/Phi-3.5-vision-instruct"

engine_kwargs:
  tensor_parallel_size: 1
  max_model_len: 4096
  max_num_seqs: 5
  enable_chunked_prefill: true
  max_num_batched_tokens: 5120
  limit_mm_per_prompt:
    image: 1
  mm_processor_kwargs:
    num_crops: 16  # 16 for single frame, 4 for multi-frame
  trust_remote_code: true  # Required for Phi-3
  tokenizer_mode: auto
  dtype: auto
  kv_cache_dtype: auto
  enable_prefix_caching: true
  use_v2_block_manager: true

batch_size: 16
concurrency: 1

