# Uses Hydra Submitit Slurm launcher
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
timeout_min: 2880
nodes: 1
tasks_per_node: 1
cpus_per_task: 16
mem_gb: ${runtime.job_memory_gb}
partition: pierson
array_parallelism: 1
gpus_per_node: 4
name: URBANVQA
additional_parameters:
  gres: gpu:4
  wckey: ""
setup:
  - export HYDRA_FULL_ERROR=1
  - source ~/.bashrc
  - source /share/pierson/matt/mllmsci/.venv/bin/activate
  - export PYTHONUNBUFFERED=1
  - export PYTHONPATH=/share/pierson/matt/URBANVQA:$PYTHONPATH
  - export URBANVQA_VERIFY_DEBUG=1
  - export URBANVQA_TENSOR_PARALLEL_SIZE=1
  - echo "=== GPU sanity (pre-job) ==="
  - echo "HOST=$(hostname) DATE=$(date)"
  - echo "CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES SLURM_JOB_GPUS=$SLURM_JOB_GPUS SLURM_STEP_GPUS=$SLURM_STEP_GPUS SLURM_GPUS_ON_NODE=$SLURM_GPUS_ON_NODE"
  - nvidia-smi -L || true
  - python -c 'import torch; print("torch.cuda.is_available=", torch.cuda.is_available()); print("torch.cuda.device_count=", torch.cuda.device_count()); [print(f"torch device {i}=", torch.cuda.get_device_name(i)) for i in range(torch.cuda.device_count())]' || true
  - unset WANDB_DISABLED
  - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
  - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
  - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
  - export WANDB_SILENT=true
  # Disable wandb service for distributed environments (uses in-process mode)
  - export WANDB_DISABLE_SERVICE=true
  # Ensure Ray detached actors are created in a stable namespace per run
  - export RAY_NAMESPACE=${oc.env:WANDB_GROUP,urbanvqa}
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - export VLLM_USE_V1=1
  - export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:64,expandable_segments:True
  - export CUDA_LAUNCH_BLOCKING=0
  - export TOKENIZERS_PARALLELISM=false
  # RTX A6000 = sm_86 -- avoid compiling for all architectures
  - export TORCH_CUDA_ARCH_LIST=8.6
  # Explicit Ray object store cap (bytes).  With deferred image loading
  # (images decoded lazily in preprocess, not eagerly in the data pipeline),
  # the object store holds mostly lightweight string rows during the ~2 min
  # vLLM warmup.  80 GB provides ample headroom for steady-state buffering
  # of PIL-image-bearing rows without triggering disk spills.
  - export RAY_OBJECT_STORE_MEMORY=80000000000
  # Let SLURM set CUDA_VISIBLE_DEVICES based on allocated GPUs for auto-detection
  # Fallback: disable CPU bind via env if launcher ignores srun_args
  - export SLURM_CPU_BIND=none

