# VQA Prompt Configuration

system_prompt: ""

# User prompt template (prompt from data column is inserted here)
user_prompt: |-
  Based on this road CCTV image, analyze if there is a flood or not. Use this JSON example format:
  {
  “flood”: true,
  “confidence”: 0.95,
  “reasoning”: “The road is submerged in water, indicating a flood.”
  }
  If there is a flood, set “flood” to true; otherwise, set it to false. The “confidence” should be a
  float between 0 and 1, indicating your confidence in the prediction. The “reasoning” should be a
  short explanation of your decision.

