# Hierarchical Prompt Configuration Example
# Multi-step reasoning with intermediate outputs

prompt:
  hierarchical:
    enabled: true
    steps:
      - name: "observation"
        prompt: "Describe what you see in this image."
        output_key: "observation"
      - name: "reasoning"
        prompt: "Based on your observation: {{observation}}, analyze the urban planning implications."
        output_key: "reasoning"
      - name: "answer"
        prompt: "Finally, answer: {{final_question}}"
        output_key: "answer"

