# VQA Prompt Configuration

system_prompt: "You are a helpful assistant that answers questions about images accurately and concisely."

# User prompt template (prompt from data column is inserted here)
user_prompt: |-
  Analyze and estimate the deepest floodwater level of the image. The estimated floodwater level should be one of the following:
  - Level 0: 0 cm,
  - Level 1: 1-15 cm,
  - Level 2: 16-40 cm,
  - Level 3: 41-60 cm,
  - Level 4: 61-100 cm.
  Give the answer with brief and reasonable explanations.

