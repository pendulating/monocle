# Nexar Dashcam Dataset Configuration
# Dataset: Dashcam images from directory (no parquet required)
# Images are read directly from the directory using ray.data.read_images()
# No need to create a parquet file - just specify image_path and default_prompt

# Optional: parquet_path (only needed if you want to use a pre-existing parquet file)
# If specified and file exists, metadata columns will be loaded and joined with images
# Metadata columns can be used in Jinja2 templates for dynamic prompt generation
parquet_path: ""

columns:
  # Required: text prompt/question
  prompt: prompt
  
  # Optional: sample identifier
  sample_id: sample_id
  
  # Required: at least one image source
  image_path: image_path      # Path to local image files

# Path to directory containing images
# This will be used to generate the dataset on-the-fly
image_path: /share/ju/nexar_data/2023/2023-08-20/604222321527357439/frames

# Default prompt for all images (can be overridden by per-image prompts in parquet)
default_prompt: "Does this image show more than a foot of standing water?"

# Optional: Explicitly specify metadata columns to load from parquet
# If not specified, all non-standard columns will be loaded automatically
# metadata_columns:
#   - location
#   - timestamp
#   - camera_id
#   - weather_conditions
