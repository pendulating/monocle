# @package _global_
# VQA Pipeline Configuration for Nexar Dashcam Dataset
# Processes prompt + image(s) -> answer(s)

defaults:
  - _self_  # Best Practice: Include _self_ for explicit composition order control
  - override /hydra/launcher: slurm_monitor
  - override /data: nexar_dashcam
  - override /model: vllm_multimodal_qwen3_vl_30b  # Use multimodal model for VQA
  - override /prompt: vqa

runtime:
  multimodal_enabled: true
  image_fallback: false  # VQA requires images; fail if missing
  batch_inference: true
  streaming_io: true  # Recommended for large datasets
  job_memory_gb: 32  # Memory for SLURM job

pipeline:
  output_root: ${runtime.output_root}
  allow_partial: false
  graph:
    nodes:
      vqa:
        stage: vqa
        depends_on: []
        outputs:
          results: outputs/vqa/results.parquet
        overrides:
          runtime.streaming_io: ${runtime.streaming_io}
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
          # Model config for 2-GPU setup (slurm_gpu_2x)
          # Multimodal model (e.g., Qwen2.5-VL-7B-Instruct) - adjust based on downloaded model
          # Update model_source to point to downloaded model in zoo
          model.model_source: /share/pierson/matt/zoo/models/Qwen3-VL-30B-A3B-Instruct  # Update after downloading
          model.engine_kwargs.gpu_memory_utilization: 0.85  # Multimodal models need memory for images
          model.engine_kwargs.tensor_parallel_size: 2
          model.engine_kwargs.max_model_len: 8192
          model.engine_kwargs.max_num_batched_tokens: 8192
          model.engine_kwargs.limit_mm_per_prompt.image: 1
          model.engine_kwargs.trust_remote_code: true
          model.concurrency: 1
          model.batch_size: 16
        launcher: slurm_gpu_2x
        wandb_suffix: vqa_nexar
  
# Model config uses vllm_multimodal_zoo.yaml as base
# Overrides specify the exact model path and GPU settings
# Default model_source: /share/pierson/matt/zoo/models/Qwen2.5-VL-7B-Instruct
# 
# To download a model, run:
#   python scripts/download_mllm_model.py \
#       --model_name Qwen/Qwen2.5-VL-7B-Instruct \
#       --zoo_path /share/pierson/matt/zoo/models
#
# Alternative models:
#   - Qwen/Qwen2.5-VL-3B-Instruct (smaller, faster, less capable)
#   - Qwen/Qwen2-VL-7B-Instruct (alternative 7B model)
#   - Qwen/Qwen2-VL-2B-Instruct (very small, fast)

data:
  columns:
    prompt: prompt
    sample_id: sample_id
    image_path: image_path
    image_url: image_url
    image_base64: image_base64

