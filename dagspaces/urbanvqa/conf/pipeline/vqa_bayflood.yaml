# @package _global_
# VQA Pipeline Configuration for BayFlood dataset
# Uses processed train/test splits generated under data/bayflood_splits

defaults:
  - _self_
  - override /hydra/launcher: slurm_monitor
  - override /data: bayflood
  - override /model: vllm_multimodal_qwen2.5_vl_7b
  - override /prompt: vqa

runtime:
  multimodal_enabled: true
  image_fallback: false
  batch_inference: true
  streaming_io: true
  job_memory_gb: 32

pipeline:
  output_root: ${runtime.output_root}
  allow_partial: false
  graph:
    nodes:
      vqa:
        stage: vqa
        depends_on: []
        outputs:
          results: outputs/vqa/results.parquet
        overrides:
          runtime.streaming_io: ${runtime.streaming_io}
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
          # Select BayFlood split (train or test)
          data.split: train
          # Model settings tuned for Qwen2.5-VL-7B on 2 GPUs
          model.model_source: /share/pierson/matt/zoo/models/Qwen2.5-VL-7B-Instruct
          model.engine_kwargs.gpu_memory_utilization: 0.85
          model.engine_kwargs.tensor_parallel_size: 2
          model.engine_kwargs.max_model_len: 28672
          model.engine_kwargs.max_num_batched_tokens: 5120
          model.engine_kwargs.limit_mm_per_prompt.image: 1
          model.engine_kwargs.trust_remote_code: true
          model.engine_kwargs.enforce_eager: true
          model.engine_kwargs.disable_custom_all_reduce: false
          model.engine_kwargs.guided_decoding_backend: auto
          model.concurrency: 1
          model.batch_size: 16
          prompt.structured_output:
            enabled: true
            json_schema:
              type: object
              properties:
                answer:
                  type: string
                  enum: ["Yes", "No"]
              required: ["answer"]
              additionalProperties: false
        launcher: g2_slurm_pierson
        wandb_suffix: vqa_bayflood

# To run on the test split, override data.split=test or set runtime.sample_n
# during invocation.

