# @package _global_
# Case | Parks / plazas   (umbrella: signs of public investment + gov management)
# MVP pipeline: park-level pairwise VQA on "which park or plaza is better
# maintained".
#
# Mirrors `pairwise_libraries_mvp.yaml` with two changes:
#   1. data   — cyclomedia_near_libraries_facing → cyclomedia_near_parks_facing
#   2. prompt — pairwise_library_maintained_ordinal → pairwise_parks_plazas_ordinal
#
# The unit manifest was built on 2026-08-11 with:
#   python -m dagspaces.common.curation facdb-facilities \
#       --facgroup "PARKS AND PLAZAS" --out curation/facdb_parks_plazas/
#   python -m dagspaces.common.curation materialize-cyclomedia \
#       --curation-root curation/facdb_parks_plazas \
#       --output-filename cyclomedia_near_parks.parquet
# Result: 2,582 FacDB units → 103,478 facing rows over 2,064 unique units
# (20.9% kept). Run the curation CLI from `.venv-nightly` — `.venv-3.12` has no
# polars.
#
# Single-model submit:
#   python -m dagspaces.urbanpairvqa.cli -m pipeline=pairwise_parks_plazas_mvp
#
# Full sweep — reuse the libraries launcher sweep (same unit-mode profile):
#   python -m dagspaces.urbanpairvqa.cli --multirun \
#       +sweep=libraries_all_models pipeline=pairwise_parks_plazas_mvp
#
# NotSure abstention is ON by default (prompt.structured_output.allow_not_sure).
# Disable for an ablation with:
#   ... pipeline=pairwise_parks_plazas_mvp prompt.structured_output.allow_not_sure=false
#
# Dry-run (no GPU — still needs the manifest to exist):
#   python -m dagspaces.urbanpairvqa.cli -m pipeline=pairwise_parks_plazas_mvp \
#       runtime.debug=true runtime.sample_n=1000 runtime.skip_inference=true

defaults:
  - _self_
  - override /hydra/launcher: slurm_monitor
  - override /data: cyclomedia_near_parks_facing
  - override /prompt: pairwise_parks_plazas_ordinal
  - override /model: qwen3.5-9b/instruct

runtime:
  debug: false
  sample_n: null
  skip_inference: false
  job_memory_gb: 64

pair_sampler:
  mode: unit                  # park ↔ park, not face ↔ face
  unit_column: unit_uid
  unit_name_column: unit_name
  pair_seed: 777
  max_pairs: 100000
  # 2,064 unique units after the facing filter → C(2064, 2) = 2,129,016 canonical
  # pairs. 100k is 4.7% of that budget, so no replacement is needed.
  allow_replacement: false
  counterbalance_mode: balanced
  repeat_count: 0
  repeat_fraction: 0.10
  # Bias the image choice inside a park toward shots that face it.
  # attribution_confidence: mean 0.097, median 0.061, no zero values. The values
  # are low but they vary, so the weighted draw works.
  weight_column: attribution_confidence

pipeline:
  output_root: ${runtime.output_root}
  allow_partial: false
  graph:
    nodes:
      pairwise:
        stage: pairwise_vqa
        depends_on: []
        outputs:
          results: outputs/pairwise/parks_plazas_mvp_${now:%Y%m%d_%H%M%S}.parquet
        overrides:
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
          runtime.skip_inference: ${runtime.skip_inference}
          runtime.resume: ${runtime.resume}
          runtime.resume_chunk_rows: ${runtime.resume_chunk_rows}
          pair_sampler.mode: ${pair_sampler.mode}
          pair_sampler.unit_column: ${pair_sampler.unit_column}
          pair_sampler.unit_name_column: ${pair_sampler.unit_name_column}
          pair_sampler.pair_seed: ${pair_sampler.pair_seed}
          pair_sampler.max_pairs: ${pair_sampler.max_pairs}
          pair_sampler.allow_replacement: ${pair_sampler.allow_replacement}
          pair_sampler.counterbalance_mode: ${pair_sampler.counterbalance_mode}
          pair_sampler.repeat_count: ${pair_sampler.repeat_count}
          pair_sampler.repeat_fraction: ${pair_sampler.repeat_fraction}
          pair_sampler.pairs_path: ${pair_sampler.pairs_path}
          pair_sampler.shard_count: ${pair_sampler.shard_count}
          pair_sampler.shard_index: ${pair_sampler.shard_index}
          pair_sampler.weight_column: ${pair_sampler.weight_column}
          model.model_source: ${model.model_source}
          model.engine_kwargs.gpu_memory_utilization: 0.92
          model.engine_kwargs.tensor_parallel_size: 1
          model.batch_size: 0
          model.concurrency: 1
        launcher: slurm_gpu_1x
        wandb_suffix: pairwise_parks_plazas_mvp
