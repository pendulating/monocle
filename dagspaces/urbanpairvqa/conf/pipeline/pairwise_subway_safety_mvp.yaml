# @package _global_
# Case 3 | Subway Station Safety
# MVP pipeline: subway-entrance pairwise VQA on "which station entrance appears
# safer for commuters and residents" using the MTA subway-entrance cyclomedia
# facing manifest.
#
# Mirrors `pairwise_schools_mvp.yaml` with three changes:
#   1. data         — cyclomedia_near_schools_facing → cyclomedia_near_subway_facing
#   2. prompt       — pairwise_school_send_child_ordinal → pairwise_subway_safety_ordinal
#   3. max_pairs    — 100,000. The facing-filtered manifest has 1,990 unique
#      entrances; C(1990, 2) ≈ 1.98M canonical pairs without replacement, so
#      100k fits comfortably (~5% of the canonical budget).
#
# Default model is qwen3.5-4b/instruct (same as restaurants/schools). For the
# full sweep, override via Hydra multirun:
#
#   python -m dagspaces.urbanpairvqa.cli --multirun \
#       +sweep=subway_all_models_klara2x \
#       pipeline=pairwise_subway_safety_mvp
#
# Single-model submit:
#   python -m dagspaces.urbanpairvqa.cli -m pipeline=pairwise_subway_safety_mvp
#
# Enable the abstention ("NotSure") option:
#   ... pipeline=pairwise_subway_safety_mvp prompt.structured_output.allow_not_sure=true
#
# Dry-run (no GPU):
#   python -m dagspaces.urbanpairvqa.cli -m pipeline=pairwise_subway_safety_mvp \
#       runtime.debug=true runtime.sample_n=1000 runtime.skip_inference=true

defaults:
  - _self_
  - override /hydra/launcher: slurm_monitor
  - override /data: cyclomedia_near_subway_facing
  - override /prompt: pairwise_subway_safety_ordinal
  - override /model: qwen3.5-9b/instruct

runtime:
  debug: false
  sample_n: null
  skip_inference: false
  job_memory_gb: 64

pair_sampler:
  mode: unit                  # station entrance ↔ station entrance, not face ↔ face
  unit_column: unit_uid
  unit_name_column: unit_name
  pair_seed: 777
  max_pairs: 100000
  allow_replacement: false    # 1,990 unique entrances after facing filter →
                              # ~1.98M canonical pairs without replacement; 100k
                              # fits comfortably (~5% of the canonical budget).
  counterbalance_mode: balanced
  repeat_count: 0
  repeat_fraction: 0.10
  # Bias within-entrance image selection toward confidently-facing shots
  # (see [[concept-facing-filter]]).
  weight_column: attribution_confidence

pipeline:
  output_root: ${runtime.output_root}
  allow_partial: false
  graph:
    nodes:
      pairwise:
        stage: pairwise_vqa
        depends_on: []
        outputs:
          results: outputs/pairwise/subway_safety_mvp_${now:%Y%m%d_%H%M%S}.parquet
        overrides:
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
          runtime.skip_inference: ${runtime.skip_inference}
          runtime.resume: ${runtime.resume}
          runtime.resume_chunk_rows: ${runtime.resume_chunk_rows}
          pair_sampler.mode: ${pair_sampler.mode}
          pair_sampler.unit_column: ${pair_sampler.unit_column}
          pair_sampler.unit_name_column: ${pair_sampler.unit_name_column}
          pair_sampler.pair_seed: ${pair_sampler.pair_seed}
          pair_sampler.max_pairs: ${pair_sampler.max_pairs}
          pair_sampler.allow_replacement: ${pair_sampler.allow_replacement}
          pair_sampler.counterbalance_mode: ${pair_sampler.counterbalance_mode}
          pair_sampler.repeat_count: ${pair_sampler.repeat_count}
          pair_sampler.repeat_fraction: ${pair_sampler.repeat_fraction}
          pair_sampler.pairs_path: ${pair_sampler.pairs_path}
          pair_sampler.shard_count: ${pair_sampler.shard_count}
          pair_sampler.shard_index: ${pair_sampler.shard_index}
          pair_sampler.weight_column: ${pair_sampler.weight_column}
          model.model_source: ${model.model_source}
          model.engine_kwargs.gpu_memory_utilization: 0.92
          model.engine_kwargs.tensor_parallel_size: 1
          model.batch_size: 0
          model.concurrency: 1
        launcher: slurm_gpu_1x
        wandb_suffix: pairwise_subway_safety_mvp
