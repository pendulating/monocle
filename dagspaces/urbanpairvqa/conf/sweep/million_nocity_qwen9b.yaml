# @package _global_
# NO-CITY AT 100,000 PAIRS — rater 1 of 2, qwen3.5-9b, 7 cases.
#
# ─── What changes against `million_proxy_qwen9b` ─────────────────────────────
# ONE thing: the prompt no longer names the city. Every case reads a
# `*_nocity` prompt, which is a copy of its canonical prompt with the words
# "New York City" removed from the line that says what the images show:
#
#     before:  Both show New York City subway station entrances.
#     after:   Both show subway station entrances.
#
# The question, the label set, the interpretation line, the absent persona and
# the structured output are the same bytes. Abstention is ON, as in the
# canonical battery.
#
# The `*_mvp_nocity` pipelines inherit their base case and override only the
# prompt, thus the data, the sampler and the output name do not move.
#
# ┌─ THE CONTROL IS `million_proxy_qwen9b` — MEASURED 2026-08-26 ──────────────┐
# │ `max_pairs` is 100,000 and `pair_seed` is 777, which is what the base      │
# │ pipeline already sets.                                                     │
# │                                                                            │
# │ CORRECTION. This box said the 100,000-pair draw is not part of the         │
# │ 1,000,000-pair draw. That is WRONG, and we measured it on all 7 cases:     │
# │                                                                            │
# │   canonical_pair_id  100,000 of 100,000 are in the 1,000,000 draw (100%)   │
# │   pair_id            about 100,900 of 110,000 rows match (91.7%)           │
# │                                                                            │
# │ Thus the draw at seed 777 is NESTED: a smaller draw is a subset of a       │
# │ larger one. Read this sweep against `million_proxy_*`, pair for pair.      │
# │                                                                            │
# │ Warning: join on `pair_id`, not on `canonical_pair_id`. `pair_id` carries  │
# │ the presentation order, and about 8% of the shared pairs came up in the    │
# │ opposite A/B order in the 2 batteries. A join on `canonical_pair_id`       │
# │ compares a pair to its own mirror image and reads the order effect as a    │
# │ place-name effect.                                                         │
# │                                                                            │
# │ The pair table comes from the data and the sampler, never from the prompt, │
# │ thus a `_nocity` pipeline reads the same table as its base case.           │
# └────────────────────────────────────────────────────────────────────────────┘
#
# ─── What this measures ──────────────────────────────────────────────────────
# Whether the place name carries the judgment. The model still sees the same 2
# images; it only loses the word that says where they are. A change in the
# label distribution is a change the place name caused, and nothing else.
#
# Warning: this is an ABLATION. Do not register it into a `proxy` cell beside
# the canonical prompt.
#
# ─── Sizing ──────────────────────────────────────────────────────────────────
# The prompt is 3 words shorter and the answer is the same 10 to 15 tokens,
# thus the rate does not change. The shape follows `million_proxy_qwen9b`.
#
# | Quantity            | Value                                               |
# |---------------------|-----------------------------------------------------|
# | Rows for each case  | 110,000 (100,000 pairs + a 10% repeat fraction)     |
# | Shards for each case| 10, thus about 11,000 rows for each shard           |
# | Jobs                | 70 (7 cases x 10 shards)                            |
# | Chunk               | 1,024 rows — what a preemption loses                |
#
# 11,000 rows is about 100 minutes at the measured 1.85 rows in 1 second. That
# is well over the 13-minute cold NFS import, which is the floor a shard must
# clear to be worth its own job.
#
# ─── Launch ──────────────────────────────────────────────────────────────────
#   bash scripts/launch_nocity_battery.sh --dry-run
#   bash scripts/launch_nocity_battery.sh --smoke
#   bash scripts/launch_nocity_battery.sh

sampling_params_vqa:
  max_tokens: 128

runtime:
  # REQUIRED on the preemptable partition.
  resume: true
  resume_chunk_rows: 1024

pair_sampler:
  # The same draw as `looks_proxy_qwen9b`, thus the 2 batteries pair up.
  max_pairs: 100000
  shard_count: 10

pipeline:
  graph:
    nodes:
      pairwise:
        launcher: slurm_gpu_preempt

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 32
  sweeper:
    params:
      model: qwen3.5-9b/instruct
      # The 7 NO-CITY pipelines. Each one inherits its base case and swaps the
      # prompt for the `_nocity` copy.
      pipeline: pairwise_subway_safety_mvp_nocity,pairwise_libraries_mvp_nocity,pairwise_schools_mvp_nocity,pairwise_road_quality_mvp_nocity,pairwise_parks_plazas_mvp_nocity,pairwise_restaurants_mvp_nocity,pairwise_street_photography_mvp_nocity
      # 10 shards for each case. This MUST match `pair_sampler.shard_count`.
      pair_sampler.shard_index: range(0,10)
