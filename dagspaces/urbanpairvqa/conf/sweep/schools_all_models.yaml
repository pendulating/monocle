# @package _global_
# Hydra sweep: run pairwise_schools_mvp across the same natively-multimodal
# instruction-tuned open-weights lineup as `restaurants_all_models.yaml` and
# `libraries_all_models.yaml` — no size cap.
#
# Model group paths (resolved via Hydra searchpath `pkg://dagspaces.common.conf`):
#   - gemma-4-e2b/instruct       → common/conf/model/gemma-4-e2b/instruct.yaml
#   - gemma-4-e4b/instruct       → common/conf/model/gemma-4-e4b/instruct.yaml
#   (phi-4/multimodal-instruct dropped 2026-07-01 — degenerate pairvqa output)
#   - qwen3.5-2b/instruct        → common/conf/model/qwen3.5-2b/instruct.yaml
#   - qwen3.5-4b/instruct        → common/conf/model/qwen3.5-4b/instruct.yaml
#   - qwen3.5-9b/instruct        → common/conf/model/qwen3.5-9b/instruct.yaml
#
# All five model configs were retuned to fit the pairwise prompt (2x 1024x1024
# images, ~2,200 prompt tokens for Qwen, ~700 for Gemma, ~5,400 for Phi-4-MM).
#
# Max 4 inference runs in flight at once (`array_parallelism: 4` matches the
# restaurants sweep).
#
# Usage:
#   python -m dagspaces.urbanpairvqa.cli --multirun \
#       +sweep=schools_all_models \
#       pipeline=pairwise_schools_mvp

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 4
  sweeper:
    params:
      model: >-
        gemma-4-e2b/instruct,
        gemma-4-e4b/instruct,
        qwen3.5-2b/instruct,
        qwen3.5-4b/instruct,
        qwen3.5-9b/instruct
