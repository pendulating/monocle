# Top-level Hydra config for URBANPAIRVQA

defaults:
  - _self_
  - data: cyclomedia_pairwise_manhattan_2025_1
  - prompt: pairwise_relative_ordinal
  - model: vllm_multimodal_qwen3_vl_2b
  - optional pipeline: pairwise_cyclomedia_ordinal

experiment:
  name: URBANPAIRVQA

runtime:
  debug: false
  sample_n: null
  output_root: null
  job_memory_gb: 64
  # Debug/smoke option to skip model inference and emit deterministic labels.
  skip_inference: false

pair_sampler:
  # Pair construction strategy.
  #   image: pair random images directly (legacy default; works against any
  #          parquet with image_path + sample_id).
  #   unit:  pair at a higher abstraction — sample 2 distinct units from
  #          ``unit_column``, then draw 1 image from each unit's pool.
  #          Needs a pre-attached unit column (materialize-cyclomedia
  #          populates unit_uid / unit_name by default).
  mode: image
  unit_column: unit_uid
  unit_name_column: unit_name
  pair_seed: 777
  max_pairs: null
  allow_replacement: false
  counterbalance_mode: none  # none|random|balanced
  repeat_count: 0
  repeat_fraction: 0.0
  # Optional column to bias **within-unit** image selection (unit mode only).
  # Set to e.g. "attribution_confidence" — emitted by the per-unit facing
  # filter — to prefer confidently-facing shots. `null` = uniform.
  # Missing column falls back to uniform with a one-line warning.
  weight_column: null

diagnostics:
  enabled: true
  warn_majority_ratio: 0.90
  warn_missing_answer_rate: 0.05

pairwise: {}

sampling_params_vqa:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 2048
  stop: []

wandb:
  enabled: true
  name_prefix: null
  project: ${oc.env:WANDB_PROJECT,URBANPAIRVQA}
  entity: ${oc.env:WANDB_ENTITY,urbanekg}
  group: ${oc.env:WANDB_GROUP,""}
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

