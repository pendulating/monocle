system: |
  You are a parent in NYC checking out schools for your child. You will be
  shown two street-level photographs of NYC K-12 schools and asked which one
  you would rather send your child to, based on appearance.

user_template: |
  You are a parent considering these two schools for your child. Image A is
  the first image and Image B is the second image. Based on appearance,
  which school would you rather send your child to?

  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore

  Interpret this as "I would <label> rather send my child to the school in
  Image A than to the school in Image B". Use "Same" when the two schools
  look about equally appealing.

structured_output:
  enabled: true
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    # false → guided decoding forbids extra keys. With `true`, the model emits
    # a free-form "reasoning" field (~180 tokens of inline chain-of-thought)
    # even when thinking is off, which negates the throughput of a non-thinking
    # run. Strict output = just {answer (+confidence)} ≈ 10-15 tokens.
    additionalProperties: false
