system: "You are an expert visual comparison assistant."

user_template: |
  Compare parking desirability between the two depicted areas.
  Image A is shown on the LEFT and image B on the RIGHT.
  Ask yourself: "Would I rather park in image A or image B?"
  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore
  Interpret this as "Image A is <label> preferable to park in than Image B".
  Use "Same" only when they look about equally preferable.

structured_output:
  enabled: true
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    additionalProperties: true

