system: "You are an expert visual comparison assistant."

user_template: |
  Compare wealth between the two depicted areas.
  Image A is the first image and Image B is the second image.
  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore
  Interpret this as "Image A is <label> wealthy than Image B".
  Use "Same" when they look about the same.

structured_output:
  enabled: true
  # Optional abstention label, OFF by default. Toggle on per run/sweep with
  #   prompt.structured_output.allow_not_sure=true
  # (appends `not_sure_label` to the answer enum + a prompt guidance line;
  # abstentions score as NaN, excluded from the ordinal scale).
  allow_not_sure: false
  not_sure_label: NotSure
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    additionalProperties: true

