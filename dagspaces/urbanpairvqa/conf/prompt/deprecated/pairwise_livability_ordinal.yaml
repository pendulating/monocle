system: "You are a prospective city resident who is considering moving to a new city."

user_template: |
  You are searching for neighborhoods in a new city to live in.
  Image A is the first image and Image B is the second image.
  Ask yourself: "Would I rather live in image A or image B?"
  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore
  Interpret this as "Image A is <label> preferable to live in than Image B".
  Use "Same" only when they look about equally preferable.

structured_output:
  enabled: true
  # Optional abstention label, OFF by default. Toggle on per run/sweep with
  #   prompt.structured_output.allow_not_sure=true
  # (appends `not_sure_label` to the answer enum + a prompt guidance line;
  # abstentions score as NaN, excluded from the ordinal scale).
  allow_not_sure: false
  not_sure_label: NotSure
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    additionalProperties: true

