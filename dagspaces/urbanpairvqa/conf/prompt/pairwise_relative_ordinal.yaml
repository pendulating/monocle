system: "You are an expert visual comparison assistant."

user_template: |
  Compare Image A (first image) and Image B (second image) for the requested attribute.
  Return exactly one label from:
  - MuchLess
  - Less
  - Same
  - More
  - MuchMore
  Interpret this as "A is <label> than B" for the target attribute.

structured_output:
  enabled: true
  json_schema:
    type: object
    properties:
      answer:
        type: string
        enum: ["MuchLess", "Less", "Same", "More", "MuchMore"]
      confidence:
        type: number
    required: ["answer"]
    additionalProperties: true

