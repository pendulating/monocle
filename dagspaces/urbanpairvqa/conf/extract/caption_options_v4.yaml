  - extraction_class: caption
    extraction_text: Stay fresh, friends. 🥬
    attributes:
      style: The "Punny/Witty" Vibe
  - extraction_class: caption
    extraction_text: City vibes. 🏙️
    attributes:
      style: Short & Aesthetic
  - extraction_class: caption
    extraction_text: Today’s view.
    attributes:
      style: Short & Aesthetic
  - extraction_class: caption
    extraction_text: Fresh. ✨
    attributes:
      style: Short & Aesthetic
  - extraction_class: caption
    extraction_text: Street scene.
    attributes:
      style: Short & Aesthetic
  - extraction_class: hashtags
    extraction_text: '#NYC #CityLife #FreshKitchen #Foodie #StreetPhotography #UrbanVibes #LunchTime #ExploreTheCity'
    attributes: &id002
      scope: general
- text: |
    Here are a few options for your Instagram caption, ranging from funny to casual:

    **Option 1: The Coffee Lover**
    Morning runs get hard without the fuel. ☕️🍩 Found the closest Dunkin’ before tackling the day! #DunkinLife #CoffeeFirst

    **Option 2: Neighborhood Vibe**
    Love these little neighborhood gems. There’s something charming about the old-school Dunkin’ locations mixed into the city fabric. 🏙️ #CityWalks #LocalEats

    **Option 3: Short & Punchy**
    Caffeine secured. Now where were we? 😎⚡️

    **Option 4: Funny/Relatable**
    Me pretending to work outside vs. actually standing here waiting for my latte. 👉☕️ #MondayMood #AdultingIsHard

    **Option 5: Documentation Style**
    Spotting a familiar face on the block. Said hello to 41-02! 👋 #NYCLife #QueensVibes
  extractions:
