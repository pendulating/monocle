- text: 'The question: "tell me a good angle to take a picture from." So they want a recommendation. I
    should give concrete, actionable suggestions rather than vague "get closer" type stuff. I should think
    about what the subject''s intent might be—probably they''re standing where they are and wondering
    how to improve the shot, or they want to capture the tree/neighborhood vibe.


    Let me think about several distinct angles and why each works, then pick a top recommendation. I want
    to be specific about body position relative to the visible landmarks (the tree, the SUV, the bins,
    the foreground car).

    '
  extractions:
  - extraction_class: none
    extraction_text: 'The question: "tell me'
- text: '**2. The "Skeletal Skyline" Angle (Best for Atmosphere)**

    *   **Where to stand:** Stand low to the ground, perhaps near the orange striped cone or the bottom
    of the utility pole on the left corner.

    *   **What to do:** Point your camera upward.

    *   **Why it works:** The billboard frame is a striking, jagged silhouette against the bright blue
    sky. Shooting from below emphasizes its height and gives the image a dramatic, almost industrial feel.


    **3. The "Depot Life" Angle (Best for Storytelling)**

    *   **Where to stand:** Move to the right side of the intersection, closer to the line of parked buses
    and trucks.

    *   **What to do:** Zoom in slightly to focus on the cluster of vehicles (the black SUV, the white
    car, and the trailers/buses). You can include the overgrown weeds in the foreground for contrast.

    *   **Why it works:** It highlights the contrast between the orderly city street in the foreground
    and the somewhat chaotic, stored-away nature of the vehicle depot behind it.

    '
