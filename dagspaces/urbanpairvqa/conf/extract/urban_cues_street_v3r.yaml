- text: 'The single best move here is to **drop down to street level and line yourself up parallel to
    the curb, shooting *down* the street** rather than across it. Right now you''re a bit too far back
    and perched above the scene (that rusty green rail in the foreground is the giveaway), so the photo
    reads as a flat snapshot. If you step to the sidewalk edge and point your camera along the row of
    parked cars, the maroon SUV becomes a strong foreground anchor, the sidewalk and the little black
    gate create a leading line that pulls the eye into the distance, and the wall of trees compresses
    into a nice atmospheric backdrop. The walking pedestrian then lands somewhere near the rule-of-thirds
    intersection instead of being lost in the middle.

    '
