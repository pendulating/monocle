# @package extract
# street-v3r (D130): the RETRY pass of `urban_cues_street_v3.yaml`, written by
# `scripts/f4/x2_retry.py schemas`. The same text; the positive examples are in
# reverse order, and each `none` example stays at its place. It reads only the
# texts that got a copy of an example in the first pass.
name: urban_cues_street
schema_version: street-v3r
max_char_buffer: 6000
context_window_chars: 600
max_model_len: 32768
batch_length: 512
extraction_passes: 1
temperature: 0.0
max_tokens: 6144
repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true
attribute_values:
  visual_evidence:
    valence:
    - good
    - bad
    - neutral
    category:
    - people
    - cleanliness
    - upkeep
    - greenery
    - light
    - signage
    - traffic
    - construction
    - commerce
    - architecture
    - color
    - activity
    - other
  inference:
    kind:
    - wealth
    - class
    - safety
    - crime
    - demographic
    - upkeep
    - quality
    - atmosphere
    - business_type
    - neighborhood_character
    - popularity
    - location
    - time
    - brand_knowledge
    - institution_knowledge
    - other
  person_reference:
    used_in_judgment:
    - 'yes'
    - 'no'
  image_artifact:
    kind:
    - blur
    - angle
    - occlusion
    - time_of_day
    - weather
    - other
  uncertainty:
    reason:
    - illegible
    - out_of_view
    - identity
    - knowledge
    - other
  photo_advice:
    kind:
    - position
    - framing
    - equipment
    - timing
    - effect
    - other
prompt_description: "You read text that a vision-language model wrote about one street-level\nphotograph\
  \ of a street in New York City. The user asked the model for a\ngood angle to take a picture from. A\
  \ line before the text names the model,\nand tells if the text is its private reasoning or its final\
  \ answer. The\ntext can be a part of a longer text. Extract what the model says. Do not\njudge the image\
  \ yourself, and do not add anything the text does not say.\n\nClasses:\n\n- visual_evidence: a thing\
  \ of the place that the model says it sees, with\n  the words that describe it.\n  attributes: valence\
  \ (good, bad, neutral); category (people, cleanliness,\n  upkeep, greenery, light, signage, traffic,\
  \ construction, commerce,\n  architecture, color, activity, other)\n- inference: a claim about the place\
  \ that the photograph cannot show: who\n  lives there, wealth, class, safety, upkeep, the character\
  \ of the\n  neighborhood, where it is.\n  attributes: kind (wealth, class, safety, crime, demographic,\
  \ upkeep,\n  quality, atmosphere, business_type, neighborhood_character, popularity,\n  location, time,\
  \ brand_knowledge, institution_knowledge, other)\n- person_reference: a statement about the people in\
  \ the photograph.\n  attributes: used_in_judgment (yes, no)\n- image_artifact: a statement about the\
  \ photograph that the model got: its\n  angle, its framing, the light, the weather, the blur, what blocks\
  \ the\n  view, how flat or cluttered it looks.\n  attributes: kind (blur, angle, occlusion, time_of_day,\
  \ weather, other)\n- uncertainty: language that hedges, or that says the model cannot tell.\n  attributes:\
  \ reason (illegible, out_of_view, identity, knowledge, other)\n- photo_advice: advice for the picture\
  \ that the user will take, or what\n  that picture will show or feel.\n  attributes: kind (position,\
  \ framing, equipment, timing, effect, other)\n- none: the text holds nothing of the classes above. The\
  \ span is the first\n  words of the text.\n\nRules:\n\n1. Copy each span from the text, character for\
  \ character. Never\n   paraphrase, and never join two parts of the text.\n2. Extract in text order.\
  \ Do not extract the same span two times. A\n   repeated thought is 1 extraction.\n3. Keep 3 subjects\
  \ apart: the place in the photograph (visual_evidence,\n   inference), the photograph that the model\
  \ got (image_artifact), and the\n   picture that the user will take (photo_advice). What the planned\
  \ picture\n   will feel or show (\"gives the image a dramatic feel\") is photo_advice\n   with kind\
  \ effect. A critique word that stays true of a thing of the\n   place when you stand in the street (\"\
  that rusty green rail\") is\n   visual_evidence. A word that is true only of the frame (\"cluttered\"\
  ,\n   \"cuts in awkwardly\") is image_artifact.\n4. A photo_advice span is the whole instruction or\
  \ the whole effect\n   clause: 1 sentence or 1 bullet. When it describes a thing of the place\n   or\
  \ makes a claim about the place, extract that phrase too, inside the\n   advice span, as visual_evidence\
  \ or inference. A phrase about people is\n   person_reference, also inside advice.\n5. An inference\
  \ span is 1 claim of 25 words or fewer.\n6. Notes that describe the image (\"Subject:\", \"Details to\
  \ notice:\") are\n   evidence. Extract nothing from the echo of the request at the start of\n   a trace,\
  \ from headings, option labels, goals, or notes about the plan\n   of the answer.\n7. A text with nothing\
  \ to extract gets 1 none span. Never answer with an\n   empty list.\n"
examples:
- text: 'To capture the best angle of this scene, I would recommend taking a photo from the sidewalk in
    front of the house. This vantage point offers a clear view of the well-manicured front yard, complete
    with neatly trimmed bushes and trees, as well as the charming brick walkway leading up to the house.
    The angle also allows for a glimpse of the neighboring houses on either side, adding context to the
    scene.


    By positioning yourself on the sidewalk, you can take advantage of the natural lighting and capture
    the warm tones of the brick walkway and the lush greenery of the yard. Additionally, this angle provides
    a sense of depth and perspective, drawing the viewer''s eye towards the house and creating a sense
    of invitation.


    Overall, capturing the scene from this angle will result in a visually appealing and engaging photograph
    that showcases the beauty of the front yard and the charm of the surrounding neighborhood.

    '
