- text: '### 3. The "Low-Angle Street" Shot (Best for a cinematic/dynamic look)

    The current eye-level shot is a bit flat. Changing your height can make the scene feel more interesting.

    *   **How to do it:** Crouch down low, near the fence or the blue car. Aim your camera slightly upward
    toward the building.

    *   **Why it works:** A low angle makes the architecture look more imposing and grand. It also allows
    the lines of the sidewalk and the parked cars to act as "leading lines," drawing the viewer''s eye
    deeper into the photo toward the building.

    '
