- text: '2. The hydrant as a foreground anchor with the door behind it. Right now the hydrant is centered
    but the door is off to the left, so they don''t relate. A good angle: move so the hydrant/bollards
    sit in one third (left or right) and the door aligns behind/above it, creating depth via the leading
    line of the curb. The curb line is a strong diagonal in the current frame—if you shoot along it (so
    the curb runs from bottom corner toward the building), it becomes a leading line pulling the eye to
    the door. That''s a classic and works well here because the plaza is empty and clean.


    3. Low dramatic angle from ground level near the curb, looking up. The building is tall; a low angle
    exaggerates height and makes the brick pattern and the receding windows dramatic. But careful: the
    current tilt is unintentional; a *committed* low angle with intentional perspective and maybe a wide
    lens, with the hydrant silhouetted at the bottom, could look bold. Pair with the tree on the right
    as a framing element. This is the "moody/abstract" option.

    '
