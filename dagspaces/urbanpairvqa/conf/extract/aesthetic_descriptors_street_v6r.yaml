# @package extract
# descriptors-v6-streetr (D130): the RETRY pass of `aesthetic_descriptors_street_v6.yaml`, written by
# `scripts/f4/x2_retry.py schemas`. The same text; the positive examples are in
# reverse order, and each `none` example stays at its place. It reads only the
# texts that got a copy of an example in the first pass.
name: aesthetic_descriptors
schema_version: descriptors-v6-streetr
max_char_buffer: 6000
context_window_chars: 600
max_model_len: 32768
max_tokens: 6144
batch_length: 512
extraction_passes: 1
temperature: 0.0
repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true
attribute_values:
  descriptor:
    vibe:
    - 'yes'
    - 'no'
    aspect:
    - appearance
    - atmosphere
    - social_register
    - business_type
    - figurative
    - evaluation
    - size
    - composition
    - other
    negated:
    - 'yes'
    - 'no'
    target:
    - place
    - current_photo
    - planned_photo
prompt_description: "You read a part of a text that a vision-language model wrote about 1\nstreet-level\
  \ photograph of a place in New York City. The user asked the\nmodel about a restaurant (\"Look and tell\
  \ me more about this restaurant.\")\nor asked for a camera angle (\"Look and tell me a good angle to\
  \ take a\npicture from.\"). The text is the private reasoning of the model or its\nfinal answer. A line\
  \ before the examples tells you which. Extract the\ndescriptors: the words and short phrases with which\
  \ the text characterizes\nthe place, the photograph that the model got, or the picture that the user\n\
  will take. Do not judge the image yourself.\n\nUse exactly these 2 classes:\n\n- descriptor: 1 descriptor.\n\
  \  attributes:\n  - head: the descriptor in plain form, in lower case and in the singular.\n    Leave\
  \ out an article, an intensifier (\"very\", \"a bit\"), a hedge, and\n    the frame noun (see slot).\
  \ Keep a noun that names a kind of business\n    or venue (\"local eatery\", \"takeout spot\"). Never\
  \ put a synonym in\n    place of a word.\n  - vibe: yes when the descriptor names the mood or the feel\
  \ (cozy,\n    gritty, moody), or when the text frames it as a vibe, a feel, an\n    atmosphere, a mood,\
  \ or a sense. Else no.\n  - slot: the frame noun that follows the descriptor or heads its list\n   \
  \ (\"atmosphere\" in \"inviting atmosphere\", \"sense\" in \"sense of depth\",\n    \"vibe\" under a\
  \ \"Vibe:\" heading), in lower case and in the singular.\n    Write none when there is no frame noun.\n\
  \  - aspect: 1 of these values:\n    appearance (how it looks: weathered, ornate, sleek);\n    atmosphere\
  \ (how it feels: cozy, gritty, moody, intimate);\n    social_register (whom it is for, its class, its\
  \ standing: upscale,\n    working-class, family-run, immigrant);\n    business_type (the kind of business\
  \ or cuisine: pizza place, carry-out);\n    figurative (a metaphor or an image: hidden gem);\n    evaluation\
  \ (generic praise or judgment: beautiful, interesting, great,\n    unique, visually appealing, striking);\n\
  \    size (a size word that characterizes the place: small, tiny, tall,\n    narrow);\n    composition\
  \ (a quality of a frame: balanced, cluttered, flat, blurry,\n    low-resolution, sense of depth);\n\
  \    other.\n  - negated: yes when the text says that the thing is not so (\"Not\n    high-end\", \"\
  rather than a sit-down dining room\"), else no.\n  - target: 1 of these values:\n    place: the place,\
  \ the street, or a thing in it. A word stays place\n    when it is true of the thing in the street too\
  \ (\"the worn canopy\",\n    \"messy power lines\").\n    current_photo: the photograph that the model\
  \ got, true only of the\n    frame (\"the image is dim\", \"cluttered\", \"the current shot is flat\"\
  ).\n    planned_photo: the picture that the user will take, or what it will\n    feel or show (\"make\
  \ it more striking\", \"it feels more intimate\", \"a\n    moody look\").\n\n- none: the marker of a\
  \ part with no descriptor. It has no attributes.\n  Its span is the first 3 to 6 words of the part.\
  \ Give it only when the\n  part holds no descriptor at all. Never give it with a descriptor.\n\nEvery\
  \ value of vibe, aspect, negated, and target must be 1 of the values\nlisted. Never invent a value.\n\
  \nRules:\n\n1. Copy each span from the text, character for character. Keep quote\n   marks and plurals\
  \ as written. Never paraphrase or join 2 parts. Never\n   copy a span from the examples.\n2. The span\
  \ is the shortest phrase that holds the descriptor. Include a\n   frame noun that follows it directly\
  \ (\"cozy atmosphere\"). A span can\n   sit inside a longer span.\n3. Extract each quality as 1 extraction:\
  \ \"cozy and intimate\" gives 2.\n   Keep a fixed compound as 1 (low-key, family-run, lived-in).\n4.\
  \ A color, a material, the light, the weather, a count, an object, a\n   part of a building, a sign,\
  \ a name, a place name, and a menu item are\n   not descriptors. The size of a thing in the place (\"\
  large windows\") is\n   not a descriptor either. In a phrase about a building, a street, or a\n   neighborhood,\
  \ extract only the descriptor: \"an older, brown brick\n   building\" gives \"older\".\n5. Praise is\
  \ a descriptor: extract it with aspect evaluation. A camera\n   instruction or technique is not a descriptor:\
  \ the angle, the position,\n   the lens, the time of day, leading lines, the rule of thirds, framing.\n\
  6. A reasoning trace often opens with the request (\"User's Question\",\n   \"The user wants\"). Extract\
  \ nothing from that echo. A line that\n   describes the image (\"Image:\", \"Subject:\") is not an echo.\n\
  7. Extract a hedged descriptor too (\"seems like a neighborhood spot\").\n8. Extract a descriptor the\
  \ first time that this part uses it. Skip a\n   later use with the same head.\n9. Extract in the order\
  \ of the text. A short answer that is mostly advice\n   can still hold descriptors; read every sentence.\n"
examples:
- text: 'The alleyway between the two buildings is a great spot to take a picture from. The contrast between
    the two buildings and the alleyway creates a visually appealing composition. The tree branches hanging
    over the alleyway add a sense of depth and texture to the image. The shadows cast by the tree create
    a sense of mystery and intrigue, adding to the overall aesthetic of the image. Additionally, the alleyway
    provides a unique perspective on the buildings, highlighting their architectural details and the way
    they interact with each other. Overall, capturing the alleyway from this angle would result in a striking
    and memorable photograph.

    '
