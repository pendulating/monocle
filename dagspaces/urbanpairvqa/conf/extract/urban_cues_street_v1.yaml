- text: |
    Based on the composition of the scene, here are three distinct angles you could take to get a great shot:

    **1. The "Leading Lines" Perspective (Best for Geometry)**
    *   **Where to stand:** Step onto the sidewalk across the street from where the photo was taken.
    *   **What to do:** Align your camera so that the white stripes of the crosswalk lead your eye straight down the center of the image toward the base of the billboard and the street sign ("Tilletsan Av").
    *   **Why it works:** The parallel lines of the crosswalk create a strong sense of depth and draw attention immediately to the intersection and the tall structure.

    **2. The "Skeletal Skyline" Angle (Best for Atmosphere)**
    *   **Where to stand:** Stand low to the ground, perhaps near the orange striped cone or the bottom of the utility pole on the left corner.
    *   **What to do:** Point your camera upward.
    *   **Why it works:** The billboard frame is a striking, jagged silhouette against the bright blue sky. Shooting from below emphasizes its height and gives the image a dramatic, almost industrial feel.

    **3. The "Depot Life" Angle (Best for Storytelling)**
    *   **Where to stand:** Move to the right side of the intersection, closer to the line of parked buses and trucks.
    *   **What to do:** Zoom in slightly to focus on the cluster of vehicles (the black SUV, the white car, and the trailers/buses). You can include the overgrown weeds in the foreground for contrast.
    *   **Why it works:** It highlights the contrast between the orderly city street in the foreground and the somewhat chaotic, stored-away nature of the vehicle depot behind it.

    **Pro Tip:** If you can wait until "Golden Hour" (shortly after sunrise or before sunset), the long shadows will stretch across the crosswalk, making the geometric pattern even more striking.
  extractions:
  - extraction_class: photo_advice
    extraction_text: Step onto the sidewalk across the street from where the photo was taken
    attributes:
      kind: position
  - extraction_class: photo_advice
