- text: |
    Here's a thinking process that leads to the suggested photography angles:

    1.  **Analyze the Original Image:**
        *   **Subject Matter:** A residential-style building (possibly a house or a small institution) partially hidden by trees, a fence, a sidewalk, and parked bicycles/scooters in the foreground.
        *   **Compositional Issues:**
            *   *Foreground clutter:* The line of blue scooters/bikes creates a distracting visual barrier.
            *   *Obscured subject:* The building is largely hidden by a medium-sized tree right in the center.
            *   *Flat perspective:* The shot is taken straight-on from across the street, making it feel static and a bit "accidental" (like a street-view capture).
            *   *Lighting/Atmosphere:* Overcast sky, muted colors.

    2.  **Identify the "Hero" of the Scene:**
        *   What's interesting here? The architecture of the building (especially the arched porch/alcove on the right) and the lush greenery. The people and the bikes are incidental elements.

    3.  **Brainstorm Potential Angles (based on photography principles):**

        *   **Goal 1: Remove Clutter.** How do I get rid of those bikes?
            *   Move closer (cross the street if safe).
            *   Change the angle (shoot from a diagonal).
            *   Change the height (shoot from higher up, or lower down).

        *   **Goal 2: Show the Architecture.** How do I see the building better?
            *   Move to the right to capture the arched entryway more prominently.
            *   Move to the left to see the facade.
            *   Find a gap in the trees.

        *   **Goal 3: Create a "Story" or Composition.** How do I make it look artistic?
            *   *Framing:* Use the trees to "frame" the building rather than block it.
            *   *Leading Lines:* Use the sidewalk or the fence to lead the viewer's eye into the image.
            *   *Depth:* Create distinct foreground, middle ground, and background layers.

    4.  **Develop Specific Recommendations:**

        *   *Option A: The "Architectural Focus" (Clean & Clear)*
            *   *Action:* Move to the right side of the image. Cross the street (if safe).
            *   *Angle:* A three-quarter view focusing on that arched entryway.
            *   *Benefit:* Removes the central tree, removes the bikes, emphasizes the most interesting architectural feature.

        *   *Option B: The "Nature Frame" (Artistic & Moody)*
            *   *Action:* Stay across the street but move slightly left.
            *   *Angle:* Shoot *through* the branches of the larger tree on the left.
            *   *Benefit:* Creates a "peek-a-boo" effect, making the building feel secluded and mysterious.

        *   *Option C: The "Low Angle" (Dynamic & Powerful)*
            *   *Action:* Get low to the ground (crouch) near the fence.
            *   *Angle:* Shoot slightly upwards toward the building and the treetops.
            *   *Benefit:* Makes the architecture feel more imposing and uses the fence as a leading line.

        *   *Option D: The "Human Element" (Candid/Lifestyle)*
            *   *Action:* Focus on the people sitting by the fence.
            *   *Angle:* A closer, medium shot of the people, using the building as a blurred background (shallow depth of field).
            *   *Benefit:* Turns it from a building photo into a street photography piece.

    5.  **Review and Refine:** (Self-Correction)
        *   *Wait, I should warn the user about safety/privacy.* (Added notes about crossing the street and being respectful of people's space).
        *   *Ensure the advice is actionable.* Use clear terms like "three-quarter view" or "leading lines."
