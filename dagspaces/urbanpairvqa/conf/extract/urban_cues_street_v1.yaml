# @package extract
# Urban cue schema for the street (angle) case, version 1 (2026-10-26). Claude
# drafted it on the user's request (D125): "let's write a separate step 2
# instructions for the street photography case. ... let's align it properly
# before the smoke test." The user confirmed the border of rule 6 (D126).
#
# This is the street variant of `urban_cues_single_v1.yaml`. The street
# prompt is "Look and tell me a good angle to take a picture from.", thus most
# of an answer is camera advice, which `single-v1` has no class for. Against
# `single-v1`:
#
# 1. The 5 classes and their attribute values stay the same. The Track C
#    filter of the descriptor notebook ("inside an inference or a
#    visual_evidence span") thus means the same thing for the 2 cases.
# 2. A new class, `photo_advice`, holds the advice and the planned look of
#    the picture. Without it, the extractor must put advice in the 5 classes
#    or leave it out, and a short Llama answer that is all advice has nothing
#    to extract (the cause of the example copies of D121).
# 3. Rules 6 to 9 set the borders: the place (visual_evidence, inference),
#    the photograph that the model got (image_artifact), and the picture that
#    the user will take (photo_advice).
# 4. The 5 examples are street texts, none from the smoke input. Build them
#    with `scripts/f4/build_street_cue_examples.py`; its `--check` compares
#    them with the `target` of the `descriptors-v5` spans.
#
# The input is the descriptor input (`f4_street_desc.parquet`, U+2011 is
# "-"), thus the offsets of this run and of the descriptor run match.
#
# Warning: raise `schema_version` when you change a class, an attribute, a
# value list, or an example. Never edit a version in place.
#
# Warning: keep `attribute_values` inside `VOCABULARY` in
# `notebooks/cvpr/_extractions.py`.

name: urban_cues_street
schema_version: street-v1

# The longest street text is a qwen3.8-27b trace of 18,183 characters.
max_char_buffer: 60000

# About 7,000 tokens of instructions and examples, up to about 5,000 tokens
# of text, and the answer.
max_model_len: 49152

batch_length: 512
extraction_passes: 1
temperature: 0.0
max_tokens: 16384
use_guided_json: true
require_extraction: true

attribute_values:
  visual_evidence:
    valence: [good, bad, neutral]
    category: [people, cleanliness, upkeep, greenery, light, signage, traffic,
               construction, commerce, architecture, color, activity, other]
  inference:
    kind: [safety, quality, upkeep, wealth, class, crime, demographic, location, time, brand_knowledge, institution_knowledge, other]
  person_reference:
    used_in_judgment: ['yes', 'no']
  image_artifact:
    kind: [blur, angle, occlusion, time_of_day, weather, other]
  uncertainty:
    reason: [looks_equal, out_of_view, other]
  photo_advice:
    kind: [position, framing, equipment, timing, effect, other]

prompt_description: |
  You read text that a vision-language model wrote about one street-level
  photograph of a street in New York City. The user asked the model for a
  good angle to take a picture from. The text is the private reasoning of
  the model, or its final answer to the user. Extract what the model says.
  Do not judge the image yourself, and do not add anything the text does not
  say.

  Use exactly these classes:

  - visual_evidence: a concrete thing of the place that the model says it
    can see.
    attributes: valence (good, bad, neutral); category (people, cleanliness,
    upkeep, greenery, light, signage, traffic, construction, commerce,
    architecture, color, activity, other)
  - inference: a claim about the place that the photograph cannot show,
    which the model draws from what it sees: safety, quality, upkeep, wealth,
    class, crime, who lives there, where it is, or another claim past the
    pixels.
    attributes: kind (safety, quality, upkeep, wealth, class, crime,
    demographic, location, time, brand_knowledge, institution_knowledge,
    other)
  - person_reference: a statement about the people in the photograph.
    attributes: used_in_judgment (yes, no)
  - image_artifact: a statement about the photograph that the model got, not
    about the place: its angle, its framing, the blur, an obstruction, the
    light, the time of day, the weather, or how flat or cluttered it looks.
    attributes: kind (blur, angle, occlusion, time_of_day, weather, other)
  - uncertainty: language that hedges, or that says the model cannot tell.
    attributes: reason (looks_equal, out_of_view, other)
  - photo_advice: advice for the picture that the user will take, or what
    that picture will show or feel.
    attributes: kind (position: where to stand, how high, where to aim;
    framing: what to put in the frame and where; equipment: the lens, the
    settings, a tripod; timing: when to shoot; effect: what the planned
    picture will show or feel; other)

  Every attribute value must be one of the values listed. Use `other` when no
  listed value fits. Never invent a value.

  Rules:

  1. Copy each extraction from the text, character for character. It must be
     a span you can point to in the text. Never paraphrase, never join two
     parts of the text, and never shorten a phrase to its meaning.
  2. Do not extract the same span two times. 2 spans never overlap.
  3. Extract in the order that the spans appear in the text.
  4. A reasoning trace often opens with the request the model got ("The user
     wants...", "Analyze the Request"). Extract nothing from that echo. A
     final answer has no echo.
  5. Never answer with an empty list. Every text names at least one thing
     that the model sees or one piece of advice. Extract what is there, and
     stop. A repeated thought is 1 extraction, not 2.
  6. Keep 3 subjects apart. The place in the photograph is visual_evidence or
     inference. The photograph that the model got is image_artifact. The
     picture that the user will take is photo_advice. What the planned
     picture will feel or show ("a dramatic feel", "makes the building feel
     imposing") is photo_advice with kind effect, never inference.
  7. When advice names a thing of the place for the first time and describes
     it (a color, a state, a quality, or its place in the frame), extract
     that thing as visual_evidence, and stop the photo_advice span before it.
     A thing named with no description stays inside the advice.
  8. A phrase that says who the people are or what they do is
     person_reference, inside advice too.
  9. Extract nothing from headings and the labels of options ("The 'Low
     Angle' (Dynamic & Powerful)"), from goals, from questions that the
     model asks itself, and from notes about the plan of its answer. Short
     words that only join a thing to advice ("You can include") need no
     extraction.

