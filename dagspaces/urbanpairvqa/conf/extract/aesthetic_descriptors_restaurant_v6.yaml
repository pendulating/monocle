# @package extract
# Aesthetic descriptor schema, version 6 (2026-10-26), for the restaurant case.
# This is the x2 round of the F4 extraction (D130).
#
# 2 files share this version: `aesthetic_descriptors_restaurant_v6.yaml` and
# `aesthetic_descriptors_street_v6.yaml`. They hold the same settings, the
# same `prompt_description`, and the same `attribute_values`, word for word.
# Only the examples differ: each file shows the input shapes of its case.
#
# Changes from version 5 (the advisor review of 2026-10-26):
# - Chunks. Version 5 gave each text in 1 call (`max_char_buffer: 60000`).
#   The long traces then gave loops and few spans at the end of the text.
#   Version 6 cuts each text into chunks of 6,000 characters, with 600
#   characters of context from the chunk before.
# - The `none` class. With chunks, many parts hold no descriptor. Version 5
#   let the model give an empty list, and the model then skipped real
#   descriptors. Now each chunk gives at least 1 extraction
#   (`require_extraction: true`), and a part with no descriptor gives 1
#   `none` span: its first words. Exactly 1 example shows it; it is never
#   the last example.
# - Extract and tag, not skip. The model obeyed the "skip" rules of
#   version 5 badly: it dropped praise and size words in the Llama answers.
#   3 new aspects keep these words and let the analysis filter them:
#   `evaluation` (generic praise), `size` (a size of the place), and
#   `composition` (a quality of a frame). Camera instructions and techniques
#   stay out, and 1 example shows the skip.
# - `target` has 3 values that match the 3 subjects of the street cue
#   schema (`street-v3`): `place` (visual_evidence, inference),
#   `current_photo` (image_artifact), and `planned_photo` (photo_advice).
#   A word that stays true of the thing in the street is `place`; a word
#   that is true only of the frame is `current_photo` (D127). A word about
#   what the planned picture will feel or show is `planned_photo` (D126).
#   The restaurant file uses the same 3 values; its texts are mostly `place`.
# - Short examples: 6 examples of 250 to 1,250 characters, cut from real
#   texts, 1 for each input shape, with a middle cut of a trace. Version 5
#   had 9 long examples, and the model copied spans from them.
# - A context line for each text (the field, the model, and the prompt)
#   comes before the examples (`build_x2_input.py`, column `context`).
# - Fewer rules: 9, with 1 example for each skip.
#
# Input: `data/f4_traces/extract_input/f4_restaurant_x2.parquet`. No example comes
# from `x2_smoke_doc_ids.json`.
#
# Every `extraction_text` appears in its own `text` word for word.
# `scripts/f4/build_descriptor_v6_examples.py --case restaurant` builds each span
# as a slice of its text and prints the examples block. Change an example
# there, not here.
#
# Warning: raise `schema_version` when you change the class, an attribute, a
# value list, a rule, or an example. Never edit a version in place. When you
# change the rules, change both files.

name: aesthetic_descriptors
schema_version: descriptors-v6-restaurant

# The x2 chunked run (D130). A chunk holds at most 6,000 characters. A chunk
# after the first gets the last 600 characters of the chunk before it as
# context (`context_window_chars`). The longest text is about 55,000
# characters, thus it gives about 10 chunks.
max_char_buffer: 6000
context_window_chars: 600
max_model_len: 32768
max_tokens: 6144

batch_length: 512
extraction_passes: 1
temperature: 0.0
repetition_penalty: 1.0
use_guided_json: true
# Each chunk gives at least 1 extraction: a descriptor, or the `none` marker.
require_extraction: true
# A span that is a substring of the chunk but did not align gets its offsets
# from an exact search (`rescue_offsets`).
rescue_substrings: true

# `head` and `slot` are free strings on purpose (D112). `none` has no
# attributes. This block is the same in the restaurant and the street file.
attribute_values:
  descriptor:
    vibe: ['yes', 'no']
    aspect: [appearance, atmosphere, social_register, business_type, figurative, evaluation, size, composition, other]
    negated: ['yes', 'no']
    target: [place, current_photo, planned_photo]

prompt_description: |
  You read a part of a text that a vision-language model wrote about 1
  street-level photograph of a place in New York City. The user asked the
  model about a restaurant ("Look and tell me more about this restaurant.")
  or asked for a camera angle ("Look and tell me a good angle to take a
  picture from."). The text is the private reasoning of the model or its
  final answer. A line before the examples tells you which. Extract the
  descriptors: the words and short phrases with which the text characterizes
  the place, the photograph that the model got, or the picture that the user
  will take. Do not judge the image yourself.

  Use exactly these 2 classes:

  - descriptor: 1 descriptor.
    attributes:
    - head: the descriptor in plain form, in lower case and in the singular.
      Leave out an article, an intensifier ("very", "a bit"), a hedge, and
      the frame noun (see slot). Keep a noun that names a kind of business
      or venue ("local eatery", "takeout spot"). Never put a synonym in
      place of a word.
    - vibe: yes when the descriptor names the mood or the feel (cozy,
      gritty, moody), or when the text frames it as a vibe, a feel, an
      atmosphere, a mood, or a sense. Else no.
    - slot: the frame noun that follows the descriptor or heads its list
      ("atmosphere" in "inviting atmosphere", "sense" in "sense of depth",
      "vibe" under a "Vibe:" heading), in lower case and in the singular.
      Write none when there is no frame noun.
    - aspect: 1 of these values:
      appearance (how it looks: weathered, ornate, sleek);
      atmosphere (how it feels: cozy, gritty, moody, intimate);
      social_register (whom it is for, its class, its standing: upscale,
      working-class, family-run, immigrant);
      business_type (the kind of business or cuisine: pizza place, carry-out);
      figurative (a metaphor or an image: hidden gem);
      evaluation (generic praise or judgment: beautiful, interesting, great,
      unique, visually appealing, striking);
      size (a size word that characterizes the place: small, tiny, tall,
      narrow);
      composition (a quality of a frame: balanced, cluttered, flat, blurry,
      low-resolution, sense of depth);
      other.
    - negated: yes when the text says that the thing is not so ("Not
      high-end", "rather than a sit-down dining room"), else no.
    - target: 1 of these values:
      place: the place, the street, or a thing in it. A word stays place
      when it is true of the thing in the street too ("the worn canopy",
      "messy power lines").
      current_photo: the photograph that the model got, true only of the
      frame ("the image is dim", "cluttered", "the current shot is flat").
      planned_photo: the picture that the user will take, or what it will
      feel or show ("make it more striking", "it feels more intimate", "a
      moody look").

  - none: the marker of a part with no descriptor. It has no attributes.
    Its span is the first 3 to 6 words of the part. Give it only when the
    part holds no descriptor at all. Never give it with a descriptor.

  Every value of vibe, aspect, negated, and target must be 1 of the values
  listed. Never invent a value.

  Rules:

  1. Copy each span from the text, character for character. Keep quote
     marks and plurals as written. Never paraphrase or join 2 parts. Never
     copy a span from the examples.
  2. The span is the shortest phrase that holds the descriptor. Include a
     frame noun that follows it directly ("cozy atmosphere"). A span can
     sit inside a longer span.
  3. Extract each quality as 1 extraction: "cozy and intimate" gives 2.
     Keep a fixed compound as 1 (low-key, family-run, lived-in).
  4. A color, a material, the light, the weather, a count, an object, a
     part of a building, a sign, a name, a place name, and a menu item are
     not descriptors. The size of a thing in the place ("large windows") is
     not a descriptor either. In a phrase about a building, a street, or a
     neighborhood, extract only the descriptor: "an older, brown brick
     building" gives "older".
  5. Praise is a descriptor: extract it with aspect evaluation. A camera
     instruction or technique is not a descriptor: the angle, the position,
     the lens, the time of day, leading lines, the rule of thirds, framing.
  6. A reasoning trace often opens with the request ("User's Question",
     "The user wants"). Extract nothing from that echo. A line that
     describes the image ("Image:", "Subject:") is not an echo.
  7. Extract a hedged descriptor too ("seems like a neighborhood spot").
  8. Extract a descriptor the first time that this part uses it. Skip a
     later use with the same head.
  9. Extract in the order of the text. A short answer that is mostly advice
     can still hold descriptors; read every sentence.

examples:
- text: |
    Here's a thinking process that leads to the suggested response:

    1.  **Analyze the Request:**
        *   **Image:** A low-resolution photo of a small strip mall or plaza.
        *   **User's Question:** "Look and tell me more about this restaurant."
        *   **Problem:** There isn't just *one* restaurant. There is a row of multiple businesses.

    2.  **Scan the Image for Business Names (Left to Right):**
        *   **Far Left:** "DOUQUIN" (Partially cut off, looks like a pizza place or similar food joint).
        *   **Next:** A "Domino's" Pizza sign.
        *   **Next:** "The Best Food Center" (Looks like a deli/grocery/cafe).
        *   **Next:** "GRILL & CHILL" (Looks like a local eatery or pub).
        *   **Far Right:** "S.O.S. [Something] MARKET" (Sign is blurry but clearly a market).
  extractions:
  - extraction_class: descriptor
    extraction_text: low-resolution
    attributes:
      head: low-resolution
      vibe: 'no'
      slot: none
      aspect: composition
      negated: 'no'
      target: current_photo
  - extraction_class: descriptor
    extraction_text: small
    attributes:
      head: small
      vibe: 'no'
      slot: none
      aspect: size
      negated: 'no'
      target: place
  - extraction_class: descriptor
    extraction_text: pizza place
    attributes:
      head: pizza place
      vibe: 'no'
      slot: none
      aspect: business_type
      negated: 'no'
      target: place
  - extraction_class: descriptor
    extraction_text: food joint
    attributes:
      head: food joint
      vibe: 'no'
      slot: none
      aspect: business_type
      negated: 'no'
      target: place
  - extraction_class: descriptor
    extraction_text: deli/grocery/cafe
    attributes:
      head: deli/grocery/cafe
      vibe: 'no'
      slot: none
      aspect: business_type
      negated: 'no'
      target: place
  - extraction_class: descriptor
    extraction_text: local eatery
    attributes:
      head: local eatery
      vibe: 'no'
      slot: none
      aspect: business_type
      negated: 'no'
      target: place
  - extraction_class: descriptor
    extraction_text: pub
    attributes:
      head: pub
      vibe: 'no'
      slot: none
      aspect: business_type
      negated: 'no'
      target: place
  - extraction_class: descriptor
    extraction_text: blurry
    attributes:
      head: blurry
      vibe: 'no'
      slot: none
      aspect: composition
      negated: 'no'
      target: current_photo
  - extraction_class: descriptor
    extraction_text: market
    attributes:
      head: market
      vibe: 'no'
      slot: none
      aspect: business_type
      negated: 'no'
      target: place
- text: |
    **3. Contextualize based on visual cues:**
    *   **Architecture:** It's an older, brown brick building, typical of New York City or major urban centers in the mid-20th century. The flat roof line and the air conditioning units suggest a functional, working-class establishment.
    *   **Location Clues:** The sign "China Garden" and the style of the building scream "New York City Chinatown" or an immigrant neighborhood outside of it. The street looks like a residential/commercial mixed area with trees lining the sidewalk.
    *   **Condition:** The building looks established but perhaps a bit dated compared to modern glass fronts. The brick is weathered.
