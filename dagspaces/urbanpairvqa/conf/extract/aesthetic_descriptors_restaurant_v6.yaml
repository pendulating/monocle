- text: |
    4.  **Formulate a Strategy for the Response:**
        *   *Acknowledge the multiple options:* Point out that there are several businesses in the photo.
        *   *List the visible businesses:* Name them clearly to help the user identify which one they want to know about.
        *   *Provide general information based on the signs:* Briefly describe what each likely is based on their names.
        *   *Ask for clarification:* Request which specific restaurant the user wants details on.
  extractions:
  - extraction_class: none
    extraction_text: 4.  **Formulate a Strategy
- text: |
    *   **Windows:** The large front windows are brightly lit and feature a distinctive blue-toned backdrop with artistic figures. This creates a theatrical, high-end, and somewhat mysterious atmosphere before you even enter.
    *   **Curb Appeal:** The use of large, uniform planters with manicured greenery and consistent branding gives the establishment a polished and sophisticated look.
