# @package extract
# single-subj-v1r (F9, draft): the RETRY pass of `urban_cues_single_subj_v1.yaml`, written with
# the rule of `scripts/f4/x2_retry.py schemas`. The same text; the positive examples are in
# reverse order, and each `none` example stays at its place. It reads only the
# texts that got a copy of an example in the first pass.
name: urban_cues_single
schema_version: single-subj-v1r
max_char_buffer: 6000
context_window_chars: 600
max_model_len: 32768
batch_length: 512
extraction_passes: 1
temperature: 0.0
max_tokens: 6144
repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true
attribute_values:
  visual_evidence:
    valence:
    - good
    - bad
    - neutral
    category:
    - people
    - cleanliness
    - upkeep
    - greenery
    - light
    - signage
    - traffic
    - construction
    - commerce
    - architecture
    - color
    - activity
    - other
  inference:
    kind:
    - wealth
    - class
    - safety
    - crime
    - demographic
    - upkeep
    - quality
    - atmosphere
    - business_type
    - neighborhood_character
    - popularity
    - location
    - time
    - brand_knowledge
    - institution_knowledge
    - other
  person_reference:
    used_in_judgment:
    - 'yes'
    - 'no'
  image_artifact:
    kind:
    - blur
    - angle
    - occlusion
    - time_of_day
    - weather
    - other
  uncertainty:
    reason:
    - illegible
    - out_of_view
    - identity
    - knowledge
    - other
  verdict:
    label:
    - 'yes'
    - 'no'
    - mixed
    - graded
    - not_applicable
prompt_description: "You read text that a vision-language model wrote about one street-level\nphotograph\
  \ in New York City. The user asked the model \"Does this look like\na nice restaurant to eat at?\".\
  \ The text is the private reasoning of the\nmodel or its final answer, and it can be one part of a longer\
  \ text.\nExtract what the model says. Do not judge the image yourself, and do not\nadd anything the\
  \ text does not say.\n\nClasses:\n\n- visual_evidence: a concrete thing that the model says it sees.\n\
  \  valence: good, bad, neutral. category: people, cleanliness, upkeep,\n  greenery, light, signage,\
  \ traffic, construction, commerce, architecture,\n  color, activity, other.\n- inference: a claim that\
  \ the photograph cannot show, which the model draws\n  from what it sees or from what it knows. kind:\
  \ wealth (price, high-end,\n  cheap), class, safety, crime, demographic (who lives, works, or eats\n\
  \  there), upkeep, quality (of the food or the service), atmosphere (the\n  feel of the place), business_type\
  \ (the cuisine or the kind of business),\n  neighborhood_character (the kind of area), popularity, location\
  \ (the\n  street, the neighborhood, the city), time (hours, era, season),\n  brand_knowledge (facts\
  \ about this business or its chain),\n  institution_knowledge (facts about a building or an institution),\
  \ other.\n- person_reference: a statement about the people in the photograph.\n  used_in_judgment: yes\
  \ when the model uses them to judge the place.\n- image_artifact: a statement about the photograph itself,\
  \ not the place.\n  kind: blur, angle, occlusion, time_of_day, weather, other.\n- uncertainty: words\
  \ that hedge or say the model cannot tell. reason:\n  illegible (cannot read a text), out_of_view, identity\
  \ (not sure what or\n  which place it is), knowledge (not sure of a fact past the image), other.\n-\
  \ verdict: the sentence or the clause in which the model answers the\n  question. label: yes (a nice\
  \ restaurant), no (not a nice restaurant),\n  mixed (the answer depends on the diner or on the meaning\
  \ of \"nice\", or\n  the model gives points for and against and takes no side), graded (one\n  middle\
  \ judgment with no yes and no no: \"decent\", \"okay\", \"perfectly\n  fine\", \"nothing special\",\
  \ \"not bad but not great\"), not_applicable (the\n  model says that the photograph shows no restaurant).\
  \ An answer for one\n  kind of diner only (\"If you want fine dining, then no\") is a verdict\n  span\
  \ with that label. A draft of the answer in a trace is a verdict\n  span.\n- none: the text holds nothing\
  \ above. Extract its first 3 to 6 words as\n  `none`, and nothing else.\n\nRules:\n\n1. Copy each span\
  \ from the text, character for character, in the order of\n   the text. Never paraphrase, and never\
  \ join two parts of the text.\n2. Do not extract the same span two times. A span can lie inside a longer\n\
  \   span when it has a different class.\n3. Extract nothing from the request that a trace repeats, from\
  \ headings,\n   or from the plan of the answer.\n4. An inference span is 1 claim, about 25 words at\
  \ most. A long\n   deliberation gives 1 span for each claim.\n5. Extract every verdict statement, in\
  \ the order of the text. A verdict\n   span is 1 sentence or 1 clause. A thing that the model sees inside\
  \ a\n   verdict sentence is also a visual_evidence or inference span, inside\n   the verdict span. A\
  \ summary that only names the kind of place (\"it\n   looks like a casual neighborhood spot\") is an\
  \ inference, not a\n   verdict. A middle rating of the place as a place to eat (\"a perfectly\n   fine\
  \ joint for a casual meal\") is a verdict with label graded.\n6. The echo of the question is not a verdict.\
  \ A \"yes\" or \"no\" about\n   another thing (\"Does it mention the location? Yes\") is not a verdict.\n"
examples:
- text: 'The building in the image appears to be a restaurant, but it does not look like a nice place
    to eat. The building is old and has a worn appearance, with graffiti on the front and a sign that
    says "GO HARLEM DRIVING SCHOOL" on the side of a car parked in front of it. The area around the building
    also appears to be somewhat run-down, with a tree growing out of the sidewalk and a few people walking
    around. Overall, the image suggests that this may not be a high-end or upscale dining experience.

    '
  extractions:
  - extraction_class: verdict
    extraction_text: it does not look like a nice place to eat
    attributes:
      label: 'no'
  - extraction_class: visual_evidence
    extraction_text: The building is old and has a worn appearance
    attributes:
      valence: bad
      category: upkeep
  - extraction_class: visual_evidence
    extraction_text: graffiti on the front
    attributes:
      valence: bad
      category: cleanliness
  - extraction_class: visual_evidence
