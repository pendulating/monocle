# @package extract
# Urban cue schema for the street case, the subjective prompt (F9, D139 and
# D140), version 1 (2026-10-30). Accepted by D142; the F9 x2 round uses it.
#
# The F9 prompt asks for a judgment: "Would this street make a good spot
# for taking a photo?". The F4 prompt asked for an angle. This schema is
# `street-v3` plus 1 class, `verdict`, that holds the answer of the model.
# Every other class, attribute and value list is the text of `street-v3`,
# thus the `visual_evidence` valence of the F9 answers stays comparable with
# the F4 answers on the same images (runbook F9, step 6; F8.1 method B).
#
# Against `street-v3`:
#
# a. The class `verdict` with the attribute `label` (yes, no, mixed,
#    graded, not_applicable; D142 added `graded`). A span is the sentence
#    or the clause in which the model answers the question. A trace can
#    hold several (the drafts of the answer). The things that the model
#    sees inside a verdict sentence are nested `visual_evidence` or
#    `inference` spans, as a `photo_advice` span holds them in `street-v3`.
#    The verdict of 1 text is a rule of the analysis, not of the extractor
#    (`f9-extraction-design.md`, section 2.3): the label of the last span;
#    `mixed` when that span is `yes` or `no` and the text also holds the
#    other one; `not_applicable` only when no other label is there; `none`
#    when the text has no verdict span.
# b. The description names the F9 prompt. The 3 subjects of `street-v3`
#    hold: the F9 answers still give photo advice ("Tips to make it a GREAT
#    spot").
# c. 7 new examples from the F9 answers, 1 for each input shape: a trace
#    start (no verdict), a plan-only chunk (`none`), a trace end (a `yes`
#    and a `no` for 2 uses, then 2 `graded` drafts), a pros-and-cons answer
#    (`mixed`), a `yes` with a pro and a con, a `no` with advice, and a
#    short Llama `no`. Built by `scripts/f9/build_subj_cue_examples.py` (to
#    write; the draft came from a scratchpad builder with the span rules of
#    `build_street_cue_examples.py --version v3`). U+2011 is "-" in the
#    example texts, as in the x2 inputs.
#
# Example texts (model|case|image_idx|field). The smoke set of the arm must
# not hold these doc_ids:
#   qwen3.5-9b|street_subj|9968|reasoning
#   gemma-4-12b|street_subj|7545|reasoning
#   qwen3.8-27b|street_subj|7895|reasoning
#   gemma-4-12b|street_subj|7895|response
#   qwen3.5-9b|street_subj|7545|response
#   qwen3.8-27b|street_subj|3719|response
#   llama-3.2-90b|street_subj|7545|response
#
# The 3 subjects, shared with `descriptors-v6`:
#
# | Subject | Cue class | Descriptor target |
# |---------|-----------|-------------------|
# | the place in the photograph | visual_evidence, inference | place |
# | the photograph that the model got | image_artifact | current_photo |
# | the picture that the user will take | photo_advice | planned_photo |
#
# D126 and D127 hold: an effect of the planned picture is `photo_advice`; a
# critique word that stays true of a thing of the place is `visual_evidence`.
#
# The settings are those of `street-v3` (D130). The input is
# `data/f4_traces/extract_input/f4_street_subj_x2.parquet`.
#
# Warning: raise `schema_version` when you change a class, an attribute, a
# value list, or an example. Never edit a version in place.
#
# Warning: keep `attribute_values` inside `VOCABULARY` in
# `notebooks/cvpr/_extractions.py`. The class `verdict` is new there.

name: urban_cues_street
schema_version: street-subj-v1

# Chunks of 6,000 characters. A chunk sees the last 600 characters of the
# chunk before it as context. 233 of the 40,000 F9 street traces are longer
# than 6,000 characters.
max_char_buffer: 6000
context_window_chars: 600

# About 6,500 tokens of instructions and examples, up to about 1,700 tokens
# of chunk, and the answer.
max_model_len: 32768

batch_length: 512
extraction_passes: 1
temperature: 0.0
# A decode loop stops at this cap and loses 1 chunk only.
max_tokens: 6144
repetition_penalty: 1.0
use_guided_json: true
require_extraction: true
rescue_substrings: true

attribute_values:
  visual_evidence:
    valence: [good, bad, neutral]
    category: [people, cleanliness, upkeep, greenery, light, signage, traffic,
               construction, commerce, architecture, color, activity, other]
  inference:
    kind: [wealth, class, safety, crime, demographic, upkeep, quality, atmosphere,
           business_type, neighborhood_character, popularity, location, time,
           brand_knowledge, institution_knowledge, other]
  person_reference:
    used_in_judgment: ['yes', 'no']
  image_artifact:
    kind: [blur, angle, occlusion, time_of_day, weather, other]
  uncertainty:
    reason: [illegible, out_of_view, identity, knowledge, other]
  photo_advice:
    kind: [position, framing, equipment, timing, effect, other]
  verdict:
    label: ['yes', 'no', mixed, graded, not_applicable]

prompt_description: |
  You read text that a vision-language model wrote about one street-level
  photograph of a street in New York City. The user asked the model "Would
  this street make a good spot for taking a photo?". A line before the text
  names the model, and tells if the text is its private reasoning or its
  final answer. The text can be a part of a longer text. Extract what the
  model says. Do not judge the image yourself, and do not add anything the
  text does not say.

  Classes:

  - visual_evidence: a thing of the place that the model says it sees, with
    the words that describe it.
    attributes: valence (good, bad, neutral); category (people, cleanliness,
    upkeep, greenery, light, signage, traffic, construction, commerce,
    architecture, color, activity, other)
  - inference: a claim about the place that the photograph cannot show: who
    lives there, wealth, class, safety, upkeep, the character of the
    neighborhood, where it is.
    attributes: kind (wealth, class, safety, crime, demographic, upkeep,
    quality, atmosphere, business_type, neighborhood_character, popularity,
    location, time, brand_knowledge, institution_knowledge, other)
  - person_reference: a statement about the people in the photograph.
    attributes: used_in_judgment (yes, no)
  - image_artifact: a statement about the photograph that the model got: its
    angle, its framing, the light, the weather, the blur, what blocks the
    view, how flat or cluttered it looks.
    attributes: kind (blur, angle, occlusion, time_of_day, weather, other)
  - uncertainty: language that hedges, or that says the model cannot tell.
    attributes: reason (illegible, out_of_view, identity, knowledge, other)
  - photo_advice: advice for the picture that the user will take, or what
    that picture will show or feel.
    attributes: kind (position, framing, equipment, timing, effect, other)
  - verdict: the sentence or the clause in which the model answers the
    question.
    attributes: label (yes: a good spot; no: not a good spot; mixed: the
    answer depends on the style of photo, or the model gives points for and
    against and takes no side; graded: one middle judgment with no yes and
    no no: "a decent spot", "okay", "meh", "fine but unremarkable";
    not_applicable: the model says it cannot judge a spot from this
    photograph, or sees no street)
    An answer for one style of photo only ("For a casual snapshot, sure") is
    a verdict span with that label. A draft of the answer in a trace is a
    verdict span.
  - none: the text holds nothing of the classes above. The span is the first
    words of the text.

  Rules:

  1. Copy each span from the text, character for character. Never
     paraphrase, and never join two parts of the text.
  2. Extract in text order. Do not extract the same span two times. A
     repeated thought is 1 extraction.
  3. Keep 3 subjects apart: the place in the photograph (visual_evidence,
     inference), the photograph that the model got (image_artifact), and the
     picture that the user will take (photo_advice). What the planned picture
     will feel or show ("gives the image a dramatic feel") is photo_advice
     with kind effect. A critique word that stays true of a thing of the
     place when you stand in the street ("that rusty green rail") is
     visual_evidence. A word that is true only of the frame ("cluttered",
     "cuts in awkwardly") is image_artifact.
  4. A photo_advice span is the whole instruction or the whole effect
     clause: 1 sentence or 1 bullet. When it describes a thing of the place
     or makes a claim about the place, extract that phrase too, inside the
     advice span, as visual_evidence or inference. A phrase about people is
     person_reference, also inside advice.
  5. An inference span is 1 claim of 25 words or fewer.
  6. Notes that describe the image ("Subject:", "Details to notice:") are
     evidence. Extract nothing from the echo of the request at the start of
     a trace, from headings, option labels, goals, or notes about the plan
     of the answer.
  7. A text with nothing to extract gets 1 none span. Never answer with an
     empty list.
  8. Extract every verdict statement, in the order of the text. A verdict
     span is 1 sentence or 1 clause. A thing of the place inside a verdict
     sentence is also a visual_evidence or inference span, inside the
     verdict span. A pro or a con that only describes the place ("The brick
     facade provides repetitive geometric patterns") is visual_evidence, not
     a verdict and not photo_advice. A middle rating of the spot ("It's an
     okay, unremarkable spot") is a verdict with label graded; an answer
     that depends on the style of photo is mixed.
  9. The echo of the question is not a verdict. A "yes" or "no" about
     another thing ("Does this answer the question? Yes") is not a verdict.

examples:
- text: |
    The user is asking for an opinion on whether the provided street scene is suitable for photography. I need to evaluate the visual elements of the image and provide a balanced answer.

    **1. Analyze the Visual Elements:**
    *   **Subject Matter:** It's an urban street scene, likely in Brooklyn or New York City (brownstones, fire escapes, "One Way" signs).
    *   **Composition:**
        *   There's a strong diagonal line created by the building on the right.
        *   The pole with signs creates a vertical element.
        *   The sidewalk leads the eye into the distance.
    *   **Lighting:** It's a sunny day with dappled sunlight filtering through the trees. This can be beautiful but also creates harsh shadows.
    *   **Details/Texture:**
        *   Brownstone architecture (brickwork, fire escapes, windows with bars).
        *   Street furniture: mailboxes (USPS), pedestrian crossing signal, yellow utility boxes, traffic signs.
        *   People walking (add life, though faces are blurred).
        *   Trees providing green contrast against the brown building and blue sky.
    *   **Clutter vs. Order:**
        *   Pros: Architectural details, interesting textures.
        *   Cons: The foreground is a bit cluttered with mailboxes, cones, and utility boxes. The people are moving (motion blur). The "No Stalking" sign is odd but adds character/context.
  extractions:
  - extraction_class: inference
    extraction_text: likely in Brooklyn or New York City (brownstones, fire escapes, "One Way" signs)
    attributes:
      kind: location
  - extraction_class: image_artifact
    extraction_text: There's a strong diagonal line created by the building on the right
    attributes:
      kind: other
