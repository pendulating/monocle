# Lightweight Submitit Slurm launcher for the orchestrator parent (monitor)
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
timeout_min: 4320
nodes: 1
tasks_per_node: 1
cpus_per_task: 1
mem_gb: 8
partition: ${oc.env:SLURM_PARTITION,pierson}
array_parallelism: 1
name: ${experiment.name}-monitor
additional_parameters:
  gres: "none"
  wckey: ""
  begin: ${oc.env:SLURM_BEGIN,now}
srun_args:
  - --gres=none
  - --cpu-bind=none
setup:
  # Make the submission context work on every pierson node:
  #
  #   1. ~/.local/bin must come first so the local `sbatch` shim (which
  #      forwards through ssh to unicorn-login-04) wins on hosts where
  #      the native slurm client is broken (e.g. lisbeth: missing
  #      /usr/local/slurm/current/etc/slurm.conf). On hosts where the
  #      native client works (e.g. klara), the shim still works but
  #      adds a harmless ssh round-trip, so this ordering is safe.
  #
  #   2. /usr/local/slurm/current/bin must be on PATH for `srun` (which
  #      submitit appends to the bottom of this script) to resolve on
  #      nodes like klara where it's missing from slurmd's default PATH.
  #      There's no ~/.local/bin/srun shim, so we need this dir too.
  - export PATH=$HOME/.local/bin:${oc.env:MLLMSCI_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
  - export HYDRA_FULL_ERROR=1
  - source ~/.bashrc
  - source ${oc.env:MLLMSCI_VENV_ACTIVATE,/share/pierson/matt/mllmsci/.venv/bin/activate}
  - unset WANDB_DISABLED
  - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
  - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
  - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
  - export WANDB_SILENT=true
  - export WANDB_DISABLE_SERVICE=true
  - export TOKENIZERS_PARALLELISM=false
  - export PYTHONUNBUFFERED=1
