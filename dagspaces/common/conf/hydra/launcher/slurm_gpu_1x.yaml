# A generic GPU launcher: 1 GPU(s) on 1 node. Set the site settings in server.env.
# A cluster launcher with the same name in a project config root (for example
# site/conf/) takes the place of this file.
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
nodes: 1
tasks_per_node: 1
array_parallelism: 1
# The site settings come from server.env (see server.env.example). A key that
# is not set is null, and submitit then leaves the sbatch option out.
partition: ${oc.env:IMAGE_FORWARD_SLURM_PARTITION,null}
account: ${oc.env:IMAGE_FORWARD_SLURM_ACCOUNT,null}
qos: ${oc.env:IMAGE_FORWARD_SLURM_QOS,null}
constraint: ${oc.env:IMAGE_FORWARD_SLURM_CONSTRAINT,null}
exclude: ${oc.env:IMAGE_FORWARD_SLURM_EXCLUDE,null}
timeout_min: 1440
cpus_per_task: 4
mem_gb: ${runtime.job_memory_gb}
gpus_per_node: 1
name: ${experiment.name}
additional_parameters:
  gres: gpu:1
setup:
  - export HYDRA_FULL_ERROR=1
  - export PYTHONUNBUFFERED=1
  # Load server.env in the job. The submitter env does not always reach the job.
  # Hydra writes the repo path into this line at compose time.
  - source ${oc.env:IMAGE_FORWARD_PROJECT_ROOT}/scripts/load_server_env.sh
  # A site script: module loads, a conda fix, an LD_PRELOAD. server.env names it.
  - if [ -n "$IMAGE_FORWARD_SITE_SETUP" ]; then source "$IMAGE_FORWARD_SITE_SETUP"; fi
  - if [ -n "$IMAGE_FORWARD_VENV_ACTIVATE" ]; then source "$IMAGE_FORWARD_VENV_ACTIVATE"; fi
  # Use a node-local /scratch mirror of the venv when the node has one.
  # See scripts/activate_stage_venv.sh and vlm-narratives-docs/scratch-mirrors.md.
  - source ${oc.env:IMAGE_FORWARD_PROJECT_ROOT}/scripts/activate_stage_venv.sh
  # Give the local GPU indices (0..N-1) to vLLM.
  - if [ -n "$SLURM_GPUS_ON_NODE" ] && [ "$SLURM_GPUS_ON_NODE" -gt 0 ]; then export CUDA_VISIBLE_DEVICES=$(seq -s, 0 $((SLURM_GPUS_ON_NODE - 1))); else unset CUDA_VISIBLE_DEVICES; fi
  - echo "HOST=$(hostname) CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES"
  - nvidia-smi -L || true
  - unset WANDB_DISABLED
  - export WANDB_SILENT=true
  - export WANDB_DISABLE_SERVICE=true
  - export TOKENIZERS_PARALLELISM=false
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  - if [ -d /scratch ]; then export TMPDIR=/scratch/$USER; else export TMPDIR=/tmp/$USER; fi
  - mkdir -p $TMPDIR
  - export SLURM_CPU_BIND=none
