# @package _global_
# Gemma-4-12B-IT: multimodal (text/image/audio → text), 12B dense, instruction-tuned.
# Configured identically to gemma-4-e4b (same gemma-4 family) so cross-size
# comparisons aren't confounded by config drift — only the weights and TP differ.
model:
  model_source: /share/pierson/matt/zoo/models/gemma-4-12B-it
  model_family: gemma-4
  # Single source of truth for SFT / GRPO / eval. See wiki/thinking-modes.md.
  # Gemma-4 is reasoning-capable — set to "off" for structured-extraction tasks.
  thinking_mode: off
  engine_kwargs:
    # Sized for pairwise VQA: 2x 1024x1024 images = ~700 prompt tokens (Gemma
    # pools to ~256 image tokens per image); with max_tokens=2048 the worst
    # case is ~2,750 tokens.
    max_model_len: 4096
    max_num_seqs: 16
    # ~24 GB bf16 weights fit a single 48 GB A6000; klara_2x then runs DP=2
    # (one replica per GPU), matching the rest of the schools sweep.
    tensor_parallel_size: 1
    trust_remote_code: true
  batch_size: 0
  concurrency: 1
