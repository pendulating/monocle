# @package _global_
model:
  model_source: /share/pierson/matt/zoo/models/Qwen3.5-9B
  model_family: qwen3.5
  # Qwen3.5-9B is a vision model (config.json has vision_config) but its name
  # lacks the "-VL" the name heuristic looks for. Force multimodal so VQA/
  # pairwise images are actually attached (text-only inference otherwise).
  multimodal: true
  # Single source of truth for SFT / GRPO / eval. See wiki/thinking-modes.md.
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    # Sized for pairwise VQA: 2x 1024x1024 images = ~2,220 prompt tokens; with
    # max_tokens=2048 generation budget the worst case is ~4,300 tokens.
    max_model_len: 6144
    # Raised 32 → 96 on 2026-08-13. vLLM reported "Maximum concurrency for
    # 6,144 tokens per request: 101.87x", thus the KV cache held room for about
    # 102 sequences while the engine ran only 32. The run used a third of the
    # GPU it asked for. 96 x 6,144 = 590k tokens, which stays inside the 626k
    # the cache holds.
    #
    # Note: a pairwise prompt is 2,158 tokens (measured, 2 x 1024x1024 images),
    # against 624 for gemma-4-12b. Thus qwen is 3.5x the prefill work for the
    # same pair, which is why it ran 26 hours where gemma ran 10. The remedy
    # for THAT is max_pixels below, but a change there changes what the model
    # sees. Do not touch it without a re-run of every case.
    max_num_seqs: 96
    tensor_parallel_size: 1
    trust_remote_code: true
    # Pairwise VQA sends TWO images per prompt. Without this, vLLM caps at 1
    # image/prompt and silently drops the second image of every pair (the
    # instruct_thinking.yaml sibling sets this; it was missing here).
    limit_mm_per_prompt:
      image: 2
    mm_processor_kwargs:
      min_pixels: 784         # 28*28
      max_pixels: 1048576     # 1024*1024; cap defends against full-res cube faces
  batch_size: 0
  concurrency: 1
