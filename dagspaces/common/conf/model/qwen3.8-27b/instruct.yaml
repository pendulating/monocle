# @package _global_
# Qwen3.8-27B: dense 27B, native multimodal, 262K context. Released by the
# Qwen org on 2026-08-14 under Apache 2.0. The architecture is
# `Qwen3_5ForConditionalGeneration`, the same as Qwen3.5-27B, thus the
# vLLM 0.25 path that runs the Qwen3.5 checkpoints loads it.
#
# Added 2026-09-20 as the version 2 trace EXTRACTOR for the gemma-4-12b judge:
# the strongest model of the other family. See
# `vlm-narratives-docs/langextract-trace-extraction.md`, "The extractor".
model:
  model_source: ${oc.env:IMAGE_FORWARD_MODEL_ZOO}/Qwen3.8-27B
  model_family: qwen3.5
  # A vision model whose name lacks "-VL". Force multimodal, as for the 9B.
  multimodal: true
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    # 54 GB of bf16 weights: 2 GPUs of 48 GB, or 1 of 80 GB or more. The
    # extraction pipeline sets `max_model_len` and `max_num_seqs` itself.
    max_model_len: 16384
    max_num_seqs: 16
    tensor_parallel_size: 2
    trust_remote_code: true
    limit_mm_per_prompt:
      image: 2
    mm_processor_kwargs:
      min_pixels: 784
      max_pixels: 1048576
  batch_size: 0
  concurrency: 1
