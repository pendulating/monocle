# Multimodal Model Configuration - Qwen3-VL-2B-Instruct (full precision)
# Same zoo path as AWQ/GPTQ variants; full-precision for accuracy when throughput is secondary.
# ~4+ GB model weights; fits on a single A6000 with room for batching.

model_source: /share/pierson/matt/zoo/models/Qwen3-VL-2B-Instruct

engine_kwargs:
  tensor_parallel_size: 1  # Single GPU -- 2B fits easily
  max_model_len: 1024  # Tight context for 512x512 images: visual + prompt + output ≈ 502
  max_num_seqs: 256  # Full precision uses more VRAM than quantized; moderate concurrency
  enable_chunked_prefill: false
  max_num_batched_tokens: 16384
  limit_mm_per_prompt:
    image: 1
  mm_processor_kwargs:
    min_pixels: 784  # 28*28
    max_pixels: 262144  # 512*512
    fps: 1
  trust_remote_code: true  # Required for Qwen VL models
  tokenizer_mode: auto
  dtype: auto  # bfloat16 typically
  kv_cache_dtype: auto
  enable_prefix_caching: true
  use_v2_block_manager: true
  disable_log_stats: true
  gpu_memory_utilization: 0.90  # Full model; slightly more conservative than quantized
  enforce_eager: false
  disable_custom_all_reduce: false

batch_size: 64
concurrency: 1
