# Multimodal Model Configuration - Qwen2.5-VL-3B-Instruct-AWQ
# AWQ W4A16 quantized variant for maximum throughput on A6000 (Ampere).
# ~3.2 GB model weights (vs 7.1 GB BF16) → frees ~3.9 GB/GPU for KV cache
# and speeds up memory-bandwidth-bound prefill by ~1.3-1.7x.

model_source: /share/pierson/matt/zoo/models/Qwen2.5-VL-3B-Instruct-AWQ

engine_kwargs:
  tensor_parallel_size: 1  # Single GPU -- model fits easily at 3B params (even more so at AWQ)
  max_model_len: 1024  # Tight context for 512x512 images: 324 visual + 162 prompt + 16 output ≈ 502
  max_num_seqs: 256  # AWQ frees KV cache headroom; pack more concurrent sequences
  enable_chunked_prefill: false  # Disabled: batch inference has no decode-latency SLA; one-shot prefill is faster
  max_num_batched_tokens: 16384  # Aggressive batching -- prefill more images per iteration
  limit_mm_per_prompt:
    image: 1  # Single image per prompt
  mm_processor_kwargs:
    min_pixels: 784  # 28*28
    max_pixels: 262144  # 512*512 -- 4.2x fewer visual tokens than 1024*1024
    fps: 1
  trust_remote_code: true  # Required for Qwen VL models
  tokenizer_mode: auto
  dtype: auto  # vLLM auto-detects AWQ quantization from config.json
  kv_cache_dtype: auto
  enable_prefix_caching: true  # Critical: same prompt repeated millions of times
  use_v2_block_manager: true
  disable_log_stats: true
  gpu_memory_utilization: 0.92  # AWQ model is smaller; can be more aggressive
  enforce_eager: false  # CUDA graphs: ~100s one-time warmup, then faster kernel dispatch on every forward pass
  disable_custom_all_reduce: false

batch_size: 64  # Higher batch size for throughput
concurrency: 1  # Single replica on single GPU (pipeline uses concurrency=4 for 4 GPUs)
