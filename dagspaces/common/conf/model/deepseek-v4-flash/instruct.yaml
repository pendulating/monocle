# @package _global_
# DeepSeek-V4-Flash-0731: a MoE of 284B parameters, 13B active, MIT license.
# The experts are native FP4 and the rest is FP8: 166.9 GB on disk. This is
# the release format, not a quantization that we made. Revision
# 7872f01b1d1fe23eabc4c98b48bffcef5a386062.
#
# Added 2026-10-24 as the F4 trace EXTRACTOR (d-0012, D93): a model of a
# family that wrote no F4 trace. 1 B300 (288 GB) holds the weights and leaves
# about 100 GB for the KV cache.
#
# The repo has no Jinja chat template. vLLM 0.25 selects
# `tokenizer_mode=deepseek_v4` from the architecture
# (`DeepseekV4ForCausalLM`), and that tokenizer encodes the chat itself. Its
# `enable_thinking: false` gives the "chat" mode, with no thought block.
# vLLM also maps `quant_method: fp8` to `deepseek_v4_fp8`.
model:
  model_source: ${oc.env:IMAGE_FORWARD_MODEL_ZOO}/DeepSeek-V4-Flash-0731
  model_family: deepseek_v4
  multimodal: false
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    # The extraction pipeline sets `max_model_len` and `max_num_seqs` itself.
    max_model_len: 32768
    max_num_seqs: 64
    tensor_parallel_size: 1
    trust_remote_code: false
    # The DeepseekV4 attention (fp8_ds_mla layout) needs an FP8 KV cache. The
    # default `auto` stops the engine with an AssertionError (smoke job 92453).
    kv_cache_dtype: fp8
  batch_size: 0
  concurrency: 1
