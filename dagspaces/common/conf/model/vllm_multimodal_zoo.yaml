# Multimodal Model Configuration - Using Zoo (Absolute Path)
# Example: Load multimodal model from local zoo

model_source: /share/pierson/matt/zoo/models/Qwen2.5-VL-3B-Instruct

engine_kwargs:
  tensor_parallel_size: 1
  max_model_len: 4096
  max_num_batched_tokens: 5120
  limit_mm_per_prompt:
    image: 1
  mm_processor_kwargs:
    min_pixels: 784
    max_pixels: 9830400
  trust_remote_code: false  # Usually not needed for zoo models
  tokenizer_mode: auto
  dtype: auto
  kv_cache_dtype: auto
  enable_prefix_caching: true
  use_v2_block_manager: true

batch_size: 16
concurrency: 1
# Note: has_image is automatically set based on model detection

