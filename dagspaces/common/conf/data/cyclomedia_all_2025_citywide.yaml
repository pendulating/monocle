# Cyclomedia citywide street-level manifest — all five boroughs, uniformly
# stratified for large-scale pairwise (image-mode) inference.
#
# Built via scripts/materialize_cyclomedia_citywide.py from the v1 catalog:
# 25,000 samples per (dataset, face) cell over the five borough datasets and
# the F/B/L/R street-level faces (U/D excluded) = 500,000 rows = 100,000 per
# borough (Brooklyn / Queens / Staten Island / Manhattan / Bronx).
#
# Regenerate with:
#   python scripts/materialize_cyclomedia_citywide.py            # 500k (default)
#   python scripts/materialize_cyclomedia_citywide.py --per-cell 5000 --output ...  # 100k
#
# This is the citywide successor to cyclomedia_all_2025_30k (which was 1,500/cell
# = 30k for the OPF vision head). image_path is already an absolute /share/ju
# path, so load_input_frame / _load_pairwise_manifest read it directly.
#
# Used by the urbanpairvqa street-photography case (pair_sampler.mode=image):
# a 100k-pair run consumes ~220k image-slots, so against 500k blocks each block
# is reused ~0.4x — most runs sample distinct blocks across all of NYC.

parquet_path: "/share/pierson/matt/mllmsci/data/cyclomedia/cyclomedia_all_2025_citywide_500k.parquet"

columns:
  sample_id: sample_id
  image_path: image_path

# Root for any image-loading code that resolves relative paths; image_path in
# the manifest is already absolute, so this is informational.
image_path: /share/ju/cyclomedia/raw

metadata_columns:
  - recording_id
  - face
  - dataset
  - latitude
  - longitude
  - yawDegrees
  - recordedAt
