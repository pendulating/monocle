# Multimodal Model Configuration - Qwen VL Models
# Optimized for Qwen/Qwen2.5-VL-* and Qwen/Qwen3-VL-* models

model_source: "Qwen/Qwen2.5-VL-3B-Instruct"

engine_kwargs:
  tensor_parallel_size: 1
  max_model_len: 4096
  max_num_seqs: 5
  enable_chunked_prefill: true
  max_num_batched_tokens: 5120
  limit_mm_per_prompt:
    image: 1
  mm_processor_kwargs:
    min_pixels: 784  # 28*28
    max_pixels: 9830400  # 1280*28*28
    fps: 1  # For video support
  trust_remote_code: false
  tokenizer_mode: auto
  dtype: auto
  kv_cache_dtype: auto
  enable_prefix_caching: true
  use_v2_block_manager: true

batch_size: 16
concurrency: 1

