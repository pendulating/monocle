# Multimodal Model Configuration - SmolVLM Models
# Optimized for HuggingFaceTB/SmolVLM2-* models

model_source: "HuggingFaceTB/SmolVLM2-2B-Instruct"

engine_kwargs:
  tensor_parallel_size: 1
  max_model_len: 4096
  max_num_seqs: 5
  enable_chunked_prefill: true
  max_num_batched_tokens: 5120
  limit_mm_per_prompt:
    image: 1
  mm_processor_kwargs:
    max_image_size:
      longest_edge: 384
  trust_remote_code: false
  tokenizer_mode: auto
  dtype: auto
  kv_cache_dtype: auto
  enable_prefix_caching: true
  use_v2_block_manager: true
  enforce_eager: true  # May be needed for small GPUs

batch_size: 16
concurrency: 1

