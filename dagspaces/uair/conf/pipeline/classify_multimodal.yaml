# Multimodal Classification Pipeline
# Classifies articles using vision-language models with image support

defaults:
  - _self_
  - override /data: multimodal_inputs
  - override /model: vllm_multimodal
  - override /prompt: classify

runtime:
  # Multimodal-specific runtime options
  multimodal_enabled: true  # Explicitly enable multimodal mode
  image_fallback: true  # Fallback to text-only if images fail to load
  debug: false
  sample_n: null
  use_llm_classify: true
  prefilter_mode: pre_gating
  keyword_buffering: true
  streaming_io: true  # Recommended for multimodal datasets

# Model configuration will be loaded from vllm_multimodal.yaml
# Override here if needed:
# model:
#   model_source: "Qwen/Qwen2.5-VL-3B-Instruct"
#   batch_size: 16  # May need to reduce for large images

# Data configuration will be loaded from multimodal_inputs.yaml
# Override here if needed:
# data:
#   columns:
#     article_text: article_text
#     image_path: image_path
#     image_url: image_url

