# TIPSv2 ViT-B/14 — Google TIPSv2 pretrained backbone.

backbone_kind: tipsv2
# Path to the TIPSv2 model directory (HF-style). Loader reads whatever format
# is there — safetensors / pytorch_model.bin / config.json.
checkpoint_path: /share/pierson/matt/zoo/models/tipsv2-b14

# timm fallback name in case the checkpoint isn't directly HF-loadable
timm_name: vit_base_patch14_dinov2.lvd142m

image_size: 448
feature_dim: 768
patch_size: 14

mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

lora_target_modules: ["attn.qkv", "attn.proj"]
