# Top-level Hydra config for URBANVIT
# ViT training + inference over urban imagery.

defaults:
  - _self_
  - data: cyclomedia_scaffolding
  - model: dinov3_vitl16
  - shard: webdataset
  - heads: scaffolding_3way
  - optional pipeline: null

experiment:
  name: URBANVIT

runtime:
  debug: false
  sample_n: null
  output_root: null
  job_memory_gb: 128

# ---------------------------------------------------------------------------
# Stage configurations
# ---------------------------------------------------------------------------

shard:
  # output_dir is set by the orchestrator from pipeline outputs; can override
  output_dir: null
  # scratch_root: base for per-user shard dirs on fast local storage
  scratch_root: ${oc.env:URBANVIT_SCRATCH_ROOT,/scratch/${oc.env:USER}/urbanvit/shards}
  # split strategy (see docs/plans/urbanvit-dagspace.md)
  split:
    group_column: recording_id     # all rows with same recording_id stay in one split
    stratify_columns: [borough, year]
    ratios: { train: 0.8, val: 0.1, test: 0.1 }
    seed: 42
  # images-per-shard for tar writes. ~3000 × 500KB ≈ 1.5 GB / shard.
  samples_per_shard: 3000
  # skip writing if shard directory already exists with a manifest.json
  skip_if_exists: true
  # image resize applied before packing (matches backbone input size)
  resize: ${model.image_size}

training:
  # set by orchestrator from pipeline outputs
  checkpoint_dir: null
  # optimization
  epochs: 20
  per_device_batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_schedule: cosine
  seed: 42
  num_workers: 8
  # mixed precision + compile
  amp_dtype: bfloat16
  torch_compile: true
  compile_mode: max-autotune
  # LoRA
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    # attention projection names vary by backbone; backbone loader resolves defaults.
    target_modules: null
  # logging / checkpointing
  log_every_steps: 25
  eval_every_epochs: 1
  save_best: true
  # fallback: skip torchrun and train single-GPU
  force_single_gpu: false

eval:
  metrics_path: null
  batch_size: 128
  num_workers: 8
  # which split to evaluate on
  split: val

extract:
  output_dir: null
  backbone_checkpoint: null   # null = use pretrained backbone from model config
  batch_size: 128
  num_workers: 8
  # which split(s) to extract features for; "all" means the full input corpus
  splits: [train, val, test]
  # output column name for the feature vector
  feature_column: feature
  # optional subset for sharded submission: [start_idx, end_idx] over shard file list
  shard_subset: null

classify:
  features_input: null
  output_path: null
  batch_size: 1024
  # only evaluate a subset of heads; null = all heads
  heads_subset: null

collate:
  scores_input: null
  output_path: null
  # after successful collate, optionally offload /scratch shards to archive dir
  offload:
    enabled: false
    archive_dir: null

wandb:
  enabled: true
  name_prefix: null
  project: ${oc.env:WANDB_PROJECT,URBANVIT}
  entity: ${oc.env:WANDB_ENTITY,urbanekg}
  group: ${oc.env:WANDB_GROUP,""}
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
