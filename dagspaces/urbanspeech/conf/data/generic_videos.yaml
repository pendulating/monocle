# Generic video inputs for speech recognition.
#
# Two ways to point at videos (parquet wins when both are set):
#   1. parquet_path — a parquet with one row per clip. Metadata columns are
#      carried through the manifest and the final transcript parquet.
#   2. video_dir + video_glob — discover clips on disk; sample_id is derived
#      from the path relative to video_dir.

parquet_path: ""

# Directory scan (used when parquet_path is empty)
# video_glob finds candidate files recursively; the extract_audio stage then
# keeps only recognised video formats (.mp4/.mov/.mkv/.avi/.webm/.ts/.m4v/.insv).
# Narrow the glob (e.g. "**/*.mp4") only if you want to scan fewer files.
video_dir: null
video_glob: "**/*"

# Blacklist: skip any video whose path contains one of these substrings
# (case-insensitive, matched against the path relative to video_dir).
# Useful for excluding whole subfolders, e.g. ["Interview"].
# Pass on the CLI as: 'data.video_exclude=[Interview]'
video_exclude: []

columns:
  # Required: path to the video file
  video_path: video_path
  # Optional: unique clip identifier (derived from filename when absent)
  sample_id: sample_id
