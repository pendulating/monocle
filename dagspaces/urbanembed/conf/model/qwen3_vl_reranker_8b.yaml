# Qwen3-VL-Reranker-8B — multimodal cross-encoder reranker via vLLM
# Uses LLM.score() with Qwen3VLForSequenceClassification architecture
# for (query, document) relevance scoring.

model_source: /share/pierson/matt/zoo/models/Qwen3-VL-Rereanker-8B

engine_kwargs:
  tensor_parallel_size: 1
  max_model_len: 8192
  max_num_seqs: 24
  limit_mm_per_prompt:
    image: 1
  mm_processor_kwargs:
    min_pixels: 2048
    max_pixels: 1310720
  trust_remote_code: true
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  hf_overrides:
    architectures:
      - Qwen3VLForSequenceClassification
    classifier_from_token:
      - "no"
      - "yes"
    is_original_qwen3_reranker: true

batch_size: 10
