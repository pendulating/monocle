# @package _global_
# One node: the describe stage on the example images (examples/images/).
#
#   dagspace _template -m pipeline=describe_images                              # stage in this process
#   dagspace _template -m pipeline=describe_images runtime.stage_launcher=slurm_gpu_1x
pipeline:
  output_root: ${runtime.output_root}
  allow_partial: false
  graph:
    nodes:
      describe:
        stage: describe
        depends_on: []
        outputs:
          results: outputs/describe/results.parquet
        overrides:
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
        launcher: ${runtime.stage_launcher}
        wandb_suffix: describe
