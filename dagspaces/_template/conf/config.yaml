# The config of the template dagspace.
defaults:
  - _self_
  - data: example_images
  - model: vllm_multimodal_qwen
  - prompt: describe
  - optional pipeline: null

experiment:
  name: TEMPLATE

runtime:
  debug: false
  sample_n: null
  output_root: null
  # Stop the stage when an image of a row does not load. With false, the row
  # gets an empty answer and __image_load_error__, and the stage continues.
  strict_images: false
  job_memory_gb: 32
  # The launcher of each stage job, for example slurm_gpu_1x. With null, the
  # stages run in the process of the CLI (or of the monitor job).
  stage_launcher: null

sampling_params:
  temperature: 0.0
  max_tokens: 128

wandb:
  enabled: true
  name_prefix: null
  project: ${oc.env:WANDB_PROJECT,TEMPLATE}
  entity: ${oc.env:WANDB_ENTITY,null}  # W&B logs only when an entity is set (server.env)
  group: ${oc.env:WANDB_GROUP,""}
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
