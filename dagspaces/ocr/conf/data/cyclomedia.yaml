# Cyclomedia Street View Data Configuration
# Handles the cube face directory structure

handler: cyclomedia

# Base path to Cyclomedia data
# Structure: {base_path}/{location_group}/{location_id}/faces/{face}.jpg
image_path: "/share/ju/cyclomedia/raw/bronx_2025_1k"

# Supported faces: B (Back), D (Down), F (Front), L (Left), R (Right), U (Up)
# All faces are automatically loaded by the Cyclomedia handler

# Optional: limit to specific faces (default: all)
# faces: ["F", "L", "R", "B"]  # Exclude Up/Down for street-level OCR

# Metadata columns extracted automatically:
# - location_group: Top-level directory (e.g., "W0ETZ")
# - location_id: Full location identifier (e.g., "W0ETZ9YV")
# - face: Cube face (B, D, F, L, R, U)

