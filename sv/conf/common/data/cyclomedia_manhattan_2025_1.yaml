# Cyclomedia Manhattan Dataset Configuration
# Panoramic street-level cube-face images from Manhattan 2025
# Dataset structure: {group}/{recording}/faces/{F,B,L,R,U,D}.jpg
#
# IMPORTANT: This dataset uses a pre-built parquet manifest because the
# Cyclomedia directory structure is deeply nested with non-image files.
# Generate the manifest first:
#   python sv/scripts/create_cyclomedia_dataset.py \
#       --image_dir /share/ju/cyclomedia/raw/manhattan_2025_1k \
#       --output_path data/cyclomedia/manhattan_2025_1k \
#       --faces F,B,L,R

# Path to the pre-built parquet manifest (set via pipeline overrides)
parquet_path: "/share/pierson/matt/mllmsci/data/cyclomedia/manhattan_2025_1_1k_scratch.parquet"

columns:
  # Prompt is NOT in the parquet manifest – it comes from the pipeline's
  # prompt YAML (e.g. conf/prompt/scaffolding_detection.yaml) and is injected
  # at runtime by the VQA stage.  Do NOT add a prompt column mapping here.

  # Optional: sample identifier (format: {recording_id}_{face})
  sample_id: sample_id

  # Required: path to local image files
  image_path: image_path

# Path to directory containing images (used for image loading)
image_path: /share/ju/cyclomedia/raw/manhattan_2025_1k

# Metadata columns available from the parquet manifest.
# Superset across all dagspaces — each dagspace uses what it needs.
metadata_columns:
  - recording_id
  - face
  - latitude
  - longitude
  - yawDegrees
