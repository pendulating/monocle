# Cyclomedia images near NYC subway station entrances (MTA entrances, all
# boroughs), buffered coverage, per-unit facing filter, with
# attribution_confidence score for downstream weighted sampling.
#
# Upstream:
#   curation/subway_entrances_all/ — subway-entrances build (see
#   sv/nyc/curation/subway/) → materialize-cyclomedia →
#   filter-facing (per-unit facing, see [[concept-facing-filter]]).
#
# Schema highlights (mirrors cyclomedia_near_schools_facing):
#   sample_id              str  — Cyclomedia sample identifier ({recording_id}_{face})
#   image_path             str  — absolute path to cube-face JPEG on NFS
#   unit_uid               str  — subway entrance uid (e.g. "376_Stair_408073939_n739192355")
#   unit_name              str  — station + entrance type (e.g. "Brook Av (Stair)")
#   unit_dist_ft           f64  — recording → entrance point distance (US ft)
#   bearing_to_unit_deg    f64  — compass bearing recording → entrance
#   delta_bearing_deg      f64  — |face_bearing − bearing_to_unit|, ∈ [0, 180°]
#   distance_to_unit_ft    f64  — same as unit_dist_ft, recomputed in filter stage
#   attribution_confidence f64  — ∈ [0, 1], higher = more confidently facing.
#                                 Feeds pair_sampler.weight_column downstream.
#   recording_id, face, dataset, latitude, longitude, bearing — catalog metadata
#
# Row count (2026-06 build): 45,890 rows across 1,990 unique subway entrances.
# C(1990, 2) ≈ 1.98M canonical pairs available without replacement, so the
# 50k-pair MVP budget fits comfortably (~2.5% of the canonical budget).

parquet_path: "/share/pierson/matt/mllmsci/curation/subway_entrances_all/cyclomedia_near_subway_facing.parquet"

columns:
  sample_id: sample_id
  image_path: image_path

image_path: /share/ju/cyclomedia/raw

# Propagate the unit-attribution + facing-diagnostic + catalog metadata
# columns into pair rows (they'll show up as <col>_a / <col>_b on the final
# pair manifest). attribution_confidence MUST be listed here — the orchestrator
# only reads columns in this list from the parquet, and pair_sampler.weight_column
# needs it to drive within-unit weighted draws.
metadata_columns:
  - unit_uid
  - unit_name
  - unit_dist_ft
  - bearing_to_unit_deg
  - delta_bearing_deg
  - distance_to_unit_ft
  - attribution_confidence
  - recording_id
  - face
  - dataset
  - latitude
  - longitude
  - bearing
