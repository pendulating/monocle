# Cyclomedia images near NYC DOB scaffolding/shed permits issued 2020-01-01
# through 2025-12-31, post-filtered to only faces that look at a permitted
# building's 80-ft buffer (sv.nyc.curation.filter_facing; 30 m ray,
# sampled at 3 points along the forward ray — see
# vault/context/wiki/scaffolding-permits-curation.md).
#
# Upstream pipeline (all under `curation/scaffolding_permits_2020_through_2025/`):
#   1. `python -m sv.nyc.curation scaffolding-permits --since 2020-01-01 --cutoff 2025-12-31 --out <dir>`
#   2. `sbatch sv/nyc/scripts/materialize_scaffolding_cyclomedia.sub <dir>`
#   3. `python -m sv.nyc.curation filter-facing --parquet <dir>/cyclomedia_near_permits.parquet --coverage <dir>/coverage.geojson --out <dir>/cyclomedia_near_permits_facing.parquet`
#
# Current size: 3,581,915 rows × 52 cols (as of 2026-04-22 build).
# Faces: F, B, L, R only (U/D drop in filter-facing — no horizontal bearing).

# Absolute path to the facing-filtered curation parquet.
parquet_path: "/share/ju/matt/mllmsci/curation/scaffolding_permits_2020_through_2025/cyclomedia_near_permits_facing.parquet"

columns:
  # Unique key within a dataset: "{recording_id}_{face}". Cross-dataset
  # duplicates (~24k rows) inherit from catalog warn check #11 — adjacent
  # boroughs' bbox overlaps. Dedupe in downstream if you need strict uniqueness.
  sample_id: sample_id
  # Absolute path to the cube-face JPEG on NFS. Rows that survive
  # filter-facing all have a valid existing path — the catalog manifest
  # check #1 (manifest.imageId == basename(recording_path)) guarantees this.
  image_path: image_path

# Common parent of every per-borough tree. The embed stage reads
# image_path as absolute from the parquet, but keeping this set lets
# relative-path-aware stages (VQA etc.) resolve correctly if they ever
# read this same manifest.
image_path: /share/ju/cyclomedia/raw

# Metadata columns to preserve alongside the embedding in downstream output.
# Superset of what urbanembed / raster / browser-index consumers read.
metadata_columns:
  - recording_id
  - face
  - dataset
  - borough
  - latitude
  - longitude
  - bearing
  - yawDegrees
  - recorderDirection
  - recordedAt
  - year
