# BayFlood Dataset Configuration
# Images are located under data/bayflood/ with split subdirectories (e.g., 0/, 1/)
# Metadata is stored in processed split folders (metadata.csv) and will be joined
# using the derived image sample_id.

processed_root: /share/pierson/matt/mllmsci/data/bayflood_1k_splits
split: train

parquet_path: ${.processed_root}/${.split}/metadata.csv

columns:
  prompt: prompt
  expected_answer: expected_answer
  image_path: image_path

image_path: ${.processed_root}/${.split}/images

default_prompt: "Does this image show more than a foot of standing water?"

metadata_columns:
  - image
  - gt
  - pred
  - prompt
  - expected_answer
  - sample_id
  - image_path
