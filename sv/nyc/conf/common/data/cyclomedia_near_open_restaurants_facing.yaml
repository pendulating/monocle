# Cyclomedia images near NYC Open Restaurants / Dining Out NYC outdoor-dining
# licenses (DCWP fpeh-f7ci, all license types / all boroughs), 80-ft-buffered
# restaurant building coverage, per-unit facing filter, with
# attribution_confidence score for downstream weighted sampling.
#
# Upstream (all under curation/open_restaurants_all/):
#   1. python -m sv.nyc.curation open-restaurants --out curation/open_restaurants_all
#   2. sbatch sv/nyc/scripts/materialize_open_restaurants_cyclomedia.sub curation/open_restaurants_all
#      (materialize-cyclomedia auto-produces the *_facing sibling via the
#       per-unit facing filter — see [[concept-facing-filter]]).
#
# Schema highlights (mirrors cyclomedia_near_restaurants_facing):
#   sample_id              str  — Cyclomedia sample identifier ({recording_id}_{face})
#   image_path             str  — absolute path to cube-face JPEG on NFS
#   unit_uid               str  — synthesized license UID of the attributed restaurant
#   unit_name              str  — DBA / facname (e.g. "JOE'S PIZZA")
#   unit_dist_ft           f64  — recording → restaurant centroid distance (US ft)
#   bearing_to_unit_deg    f64  — compass bearing recording → centroid
#   delta_bearing_deg      f64  — |face_bearing − bearing_to_unit|, ∈ [0, 180°]
#   distance_to_unit_ft    f64  — same as unit_dist_ft, recomputed in filter stage
#   attribution_confidence f64  — ∈ [0, 1], higher = more confidently facing.
#                                 Feeds pair_sampler.weight_column downstream.
#   recording_id, face, dataset, latitude, longitude, bearing — catalog metadata
#
# Row count: populated by the materialize SLURM job (see job out under
# .slurm_jobs/curation_open_restaurants/). Curation has 1,309 licensed
# restaurants across ~4 km² coverage (mostly Manhattan + Brooklyn).

parquet_path: "/share/ju/matt/mllmsci/curation/open_restaurants_all/cyclomedia_near_open_restaurants_facing.parquet"

columns:
  sample_id: sample_id
  image_path: image_path

image_path: /share/ju/cyclomedia/raw

# Propagate the unit-attribution + facing-diagnostic + catalog metadata columns
# downstream. attribution_confidence MUST be listed — the orchestrator only
# reads columns in this list, and pair_sampler.weight_column needs it for
# within-unit weighted draws.
metadata_columns:
  - unit_uid
  - unit_name
  - unit_dist_ft
  - bearing_to_unit_deg
  - delta_bearing_deg
  - distance_to_unit_ft
  - attribution_confidence
  - recording_id
  - face
  - dataset
  - latitude
  - longitude
  - bearing
