# Cyclomedia images near NYC DOHMH restaurants (camis-aggregated, all cuisines /
# all boroughs), 80-ft-buffered coverage, per-unit facing filter, with
# attribution_confidence score for downstream weighted sampling.
#
# Upstream:
#   curation/dohmh_restaurants_inspected_all/ — dohmh-restaurants build →
#   aggregate-restaurants → materialize-cyclomedia → filter-facing
#   (per-unit facing, see [[concept-facing-filter]]).
#
# Schema highlights (mirrors cyclomedia_near_libraries_facing):
#   sample_id              str  — Cyclomedia sample identifier ({recording_id}_{face})
#   image_path             str  — absolute path to cube-face JPEG on NFS
#   unit_uid               str  — DOHMH camis of the attributed restaurant
#   unit_name              str  — DBA / facname (e.g. "JOE'S PIZZA")
#   unit_dist_ft           f64  — recording → restaurant centroid distance (US ft)
#   bearing_to_unit_deg    f64  — compass bearing recording → centroid
#   delta_bearing_deg      f64  — |face_bearing − bearing_to_unit|, ∈ [0, 180°]
#   distance_to_unit_ft    f64  — same as unit_dist_ft, recomputed in filter stage
#   attribution_confidence f64  — ∈ [0, 1], higher = more confidently facing.
#                                 Feeds pair_sampler.weight_column downstream.
#   recording_id, face, dataset, latitude, longitude, bearing — catalog metadata
#
# Row count (2026-04-28 build): 490,851 rows across 18,488 unique restaurants
# (camis); ~32× more units than the libraries facing parquet.

parquet_path: "/share/ju/matt/mllmsci/curation/dohmh_restaurants_inspected_all/cyclomedia_near_restaurants_facing.parquet"

columns:
  sample_id: sample_id
  image_path: image_path

image_path: /share/ju/cyclomedia/raw

# Propagate the unit-attribution + facing-diagnostic + catalog metadata
# columns into pair rows (they'll show up as <col>_a / <col>_b on the final
# pair manifest). attribution_confidence MUST be listed here — the orchestrator
# only reads columns in this list from the parquet, and pair_sampler.weight_column
# needs it to drive within-unit weighted draws.
metadata_columns:
  - unit_uid
  - unit_name
  - unit_dist_ft
  - bearing_to_unit_deg
  - delta_bearing_deg
  - distance_to_unit_ft
  - attribution_confidence
  - recording_id
  - face
  - dataset
  - latitude
  - longitude
  - bearing
